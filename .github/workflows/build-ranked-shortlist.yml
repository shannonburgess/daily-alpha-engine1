name: Legacy option-gated ranked shortlist (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Stock-primary policy guard
        shell: bash
        run: |
          cat <<'EOF'
          This legacy ranked-shortlist publication path is disabled.

          It filtered otherwise eligible stocks by OVTLYR optionability / ORATS 45-75 DTE
          availability and allowed option quality to change the actionable ranking. That is
          inconsistent with the canonical stock-primary model-validation policy.

          Canonical policy:
          - New PAPER entries are SHARES ONLY.
          - Company liquidity remains strictly >1.5M 30-day average daily shares.
          - Broad server-side company price floor remains $10.
          - ORATS/options may enrich research/newsletter context only and cannot remove,
            delay, authorize, reject, or promote a STOCK PAPER candidate.
          - trading_authorized=false
          - live_trading_enabled=false

          A stock-primary shortlist publisher replaces this legacy scheduled path.
          EOF
