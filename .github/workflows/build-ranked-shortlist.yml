name: Build Daily Alpha ranked shortlist

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-alpha-ranked-shortlist
  cancel-in-progress: false

jobs:
  shortlist:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVTLYR_FOLDER_URL: https://drive.google.com/drive/folders/1bt6x1-wszD4DqgvoZWd7UG9nyCWPc8Bj
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
      STOCKDATA_API_KEY: ${{ secrets.STOCKDATA_API_KEY }}
      STAGING_BUCKET: daily-alpha-staging-490809405132-us-east-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require research data secrets
        shell: bash
        run: |
          if [[ -z "$ORATS_TOKEN" ]]; then
            echo "ORATS_TOKEN GitHub secret is missing" >&2
            exit 1
          fi
          if [[ -z "$STOCKDATA_API_KEY" ]]; then
            echo "STOCKDATA_API_KEY GitHub secret is missing" >&2
            exit 1
          fi

      - name: Install shortlist tools
        run: |
          python -m pip install --disable-pip-version-check . gdown==5.2.0

      - name: Download OVTLYR history
        run: |
          mkdir -p data/incoming
          gdown --folder --remaining-ok "$OVTLYR_FOLDER_URL" -O data/incoming

      - name: Build real ranked research shortlist
        id: shortlist
        shell: python
        run: |
          import os
          from datetime import UTC, datetime

          from daily_alpha.orats import OratsClient
          from daily_alpha.research_shortlist import (
              build_research_shortlist,
              discover_daily_pair,
              write_research_shortlist_outputs,
          )
          from daily_alpha.smart_money import (
              rank_congressional_acquisitions,
              rank_institutional_acquisitions,
          )
          from daily_alpha.sources import OratsBatchSource
          from daily_alpha.stockdata_smart_money import StockDataSmartMoneyClient
          from daily_alpha.trump_policy import rank_trump_policy_companies
          from daily_alpha.white_house_policy import fetch_white_house_investments

          previous, current = discover_daily_pair("data/incoming")
          now = datetime.now(UTC)

          smart_client = StockDataSmartMoneyClient()
          congress_trades = smart_client.fetch_congressional_purchases(days=90, limit=500)
          congressional = rank_congressional_acquisitions(
              congress_trades,
              as_of=now.date(),
              lookback_days=90,
              limit=5,
          )
          current_13f, previous_13f, institutional_coverage = (
              smart_client.fetch_institutional_holdings_pair(
                  as_of=now.date(),
                  institution_limit=25,
                  portfolio_limit=500,
              )
          )
          institutional = rank_institutional_acquisitions(
              current_13f,
              previous_13f,
              limit=5,
          )

          policy_watch = rank_trump_policy_companies(
              fetch_white_house_investments(limit=50),
              limit=10,
          )

          # Research data may legitimately be Friday's close during a weekend or
          # Monday premarket. Execution remains governed by runtime.py's strict
          # 25-minute delayed-data gate before any paper trade can be authorized.
          source = OratsBatchSource(
              OratsClient(mode="delayed", max_age_minutes=72 * 60)
          )
          result = build_research_shortlist(
              previous,
              current,
              as_of=now,
              orats_source=source,
              request_limit=20,
              congressional=congressional,
              institutional=institutional,
              trump_policy=policy_watch,
          )
          outputs = write_research_shortlist_outputs("data/shortlist", result)
          summary = result.summary
          print(
              f"Compared {result.previous_file} -> {result.current_file}; "
              f"ranked {summary['actionable_ranked_count']} actionable candidates, "
              f"excluded {summary['excluded_not_optionable']} OVTLYR non-optionable symbols, "
              f"excluded {summary['excluded_orats_no_45_75_dte_options']} ORATS symbols "
              f"without a 45-75 DTE chain, requested {summary['orats_requests']} ORATS chains, "
              f"found {summary['qualified_option_count']} qualified option setups, matched "
              f"{summary['smart_money_matched_candidates']} smart-money candidates and "
              f"{summary['trump_policy_matched_candidates']} policy-watch candidates."
          )
          print(
              "Smart-money leaders: Congress="
              + ", ".join(item.symbol for item in congressional)
              + " | Institutions="
              + ", ".join(item.symbol or item.cusip for item in institutional)
          )
          print(
              "Trump Administration Company & Policy Watch="
              + ", ".join(item.symbol for item in policy_watch)
          )
          print("Top ranked candidates:")
          for rank, item in enumerate(result.items[:10], start=1):
              extras = []
              if item.smart_money_bonus > 0:
                  extras.append(f"smart_money=+{item.smart_money_bonus:.1f}")
              if item.trump_policy_bonus > 0:
                  extras.append(f"policy=+{item.trump_policy_bonus:.1f}")
              confirmation = " " + " ".join(extras) if extras else ""
              print(
                  f"{rank:02d} {item.symbol} {item.display_label} "
                  f"score={item.score:.2f}{confirmation} ORATS={item.orats_reason}"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"previous_file={result.previous_file}\n")
              handle.write(f"current_file={result.current_file}\n")
              handle.write(f"ranked_count={summary['actionable_ranked_count']}\n")
              handle.write(f"qualified_count={summary['qualified_option_count']}\n")
              handle.write(
                  "orats_no_dte_count="
                  f"{summary['excluded_orats_no_45_75_dte_options']}\n"
              )
              handle.write(
                  f"smart_money_matches={summary['smart_money_matched_candidates']}\n"
              )
              handle.write(
                  f"trump_policy_matches={summary['trump_policy_matched_candidates']}\n"
              )
              handle.write(
                  "congress_top=" + ", ".join(item.symbol for item in congressional) + "\n"
              )
              handle.write(
                  "institution_top="
                  + ", ".join(item.symbol or item.cusip for item in institutional)
                  + "\n"
              )
              handle.write(
                  "trump_policy_top="
                  + ", ".join(item.symbol for item in policy_watch[:5])
                  + "\n"
              )
              handle.write(
                  f"current_13f_period={institutional_coverage.current_period}\n"
              )
              handle.write(
                  f"previous_13f_period={institutional_coverage.previous_period}\n"
              )
          assert all(path.exists() for path in outputs.values())

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-shortlist-publish
          aws-region: us-east-2

      - name: Publish ranked shortlist to AWS staging
        shell: bash
        run: |
          PREFIX="s3://${STAGING_BUCKET}/ovtlyr/shortlist"
          HISTORY="${PREFIX}/history/${GITHUB_RUN_ID}"
          for FILE in data/shortlist/*; do
            NAME="$(basename "$FILE")"
            aws s3 cp "$FILE" "${PREFIX}/latest/${NAME}" --only-show-errors
            aws s3 cp "$FILE" "${HISTORY}/${NAME}" --only-show-errors
          done
          echo "Published ranked shortlist to ${PREFIX}/latest/"

      - name: Upload ranked shortlist artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-ranked-shortlist-${{ github.run_id }}
          path: data/shortlist/*
          if-no-files-found: error
          retention-days: 30

      - name: Summarize shortlist build
        shell: bash
        run: |
          {
            echo "## Daily Alpha ranked shortlist"
            echo "- Previous OVTLYR: ${{ steps.shortlist.outputs.previous_file }}"
            echo "- Current OVTLYR: ${{ steps.shortlist.outputs.current_file }}"
            echo "- Actionable ranked candidates: ${{ steps.shortlist.outputs.ranked_count }}"
            echo "- Smart-money matches in actionable universe: ${{ steps.shortlist.outputs.smart_money_matches }}"
            echo "- Trump policy-watch matches in actionable universe: ${{ steps.shortlist.outputs.trump_policy_matches }}"
            echo "- Congressional Top 5: ${{ steps.shortlist.outputs.congress_top }}"
            echo "- Institutional Top 5: ${{ steps.shortlist.outputs.institution_top }}"
            echo "- Trump Administration Policy Watch Top 5: ${{ steps.shortlist.outputs.trump_policy_top }}"
            echo "- 13F comparison: ${{ steps.shortlist.outputs.previous_13f_period }} -> ${{ steps.shortlist.outputs.current_13f_period }}"
            echo "- ORATS exclusions with no 45-75 DTE chain: ${{ steps.shortlist.outputs.orats_no_dte_count }}"
            echo "- Qualified 45-75 DTE option setups in ORATS-enriched top 20: ${{ steps.shortlist.outputs.qualified_count }}"
            echo "- Confirmation weights: Congress max +5, institutions max +10, Trump policy watch max +5."
            echo "- Policy-watch rows are not presented as President Trump stock recommendations."
            echo "- Research only: no paper or live trade was authorized by this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
