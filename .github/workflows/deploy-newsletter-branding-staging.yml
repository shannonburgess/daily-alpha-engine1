name: Deploy newsletter branding to staging report

on:
  push:
    branches:
      - agent/deploy-newsletter-branding-staging
    paths:
      - ".github/workflows/deploy-newsletter-branding-staging.yml"

permissions:
  contents: read
  id-token: write

jobs:
  deploy-report:
    name: Test and deploy staging report Lambda
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run quality gates
        run: |
          ruff check .
          pytest -q

      - name: Build Lambda deployment package
        run: |
          rm -rf build deployment.zip
          mkdir -p build
          pip install . --target build --no-deps
          cp -R lambda_handlers build/lambda_handlers
          (cd build && zip -qr ../deployment.zip .)
          unzip -l deployment.zip | grep -E "lambda_handlers/report\.py"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-report-branding-deploy
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy report service only
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-report \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-report
          aws lambda update-function-configuration \
            --function-name daily-alpha-report \
            --handler lambda_handlers.report.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-report

      - name: Verify deployed report configuration
        run: |
          aws lambda get-function-configuration \
            --function-name daily-alpha-report \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus,LastModified:LastModified,CodeSha256:CodeSha256}'
