name: Verify Daily Alpha shadow staging E2E

on:
  push:
    branches:
      - staging/shadow-e2e-integration
    paths:
      - ".github/workflows/shadow-staging-e2e.yml"

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

concurrency:
  group: daily-alpha-shadow-staging-e2e
  cancel-in-progress: true

jobs:
  verify-shadow-e2e:
    name: Verify ingress to isolated paper audit path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Assert staging branch only
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "staging/shadow-e2e-integration"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-shadow-e2e
          aws-region: us-east-2

      - name: Run harmless v2.5 orphan-ADD ingress proof
        id: e2e
        shell: bash
        run: |
          set -euo pipefail

          SHADOW_START="$(aws lambda get-function-configuration \
            --function-name daily-alpha-pine-processor \
            --query 'Environment.Variables.DAILY_ALPHA_SHADOW_FORWARD_START' \
            --output text)"
          test "${SHADOW_START}" = "2026-08-19"

          TABLE_NAME="$(aws lambda get-function-configuration \
            --function-name daily-alpha-pine-processor \
            --query 'Environment.Variables.DAILY_ALPHA_PAPER_LEDGER_TABLE' \
            --output text)"
          test -n "${TABLE_NAME}"
          test "${TABLE_NAME}" != "None"

          SECRET_JSON="$(aws secretsmanager get-secret-value \
            --secret-id daily-alpha/pine-webhook/staging \
            --query SecretString --output text)"
          WEBHOOK_SECRET="$(SECRET_JSON="${SECRET_JSON}" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["SECRET_JSON"])
          value = payload.get("webhook_secret")
          if not isinstance(value, str) or not value:
              raise SystemExit("webhook_secret missing")
          print(value)
          PY
          )"
          echo "::add-mask::${WEBHOOK_SECRET}"

          SIGNAL_ID="STAGING-SHADOW-E2E-V25-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export SIGNAL_ID WEBHOOK_SECRET
          python - <<'PY' >/tmp/ingress-event.json
          import json
          import os
          from datetime import UTC, datetime

          now = datetime.now(UTC).isoformat()
          body = {
              "webhook_secret": os.environ["WEBHOOK_SECRET"],
              "signal_id": os.environ["SIGNAL_ID"],
              "symbol": "DAE2E",
              "action": "ADD",
              "strategy": "DA_TURTLE_ADAPTIVE_TREND",
              "strategy_version": "2.5",
              "timeframe": "D",
              "price": 100.0,
              "bar_time": now,
              "position_fraction": 0.25,
              "runner_stage": "ADD_1_ATR",
              "model_id": "PAPER_SHADOW_V25",
              "forward_test_start": "2026-08-19",
          }
          print(json.dumps({"body": body}, separators=(",", ":")))
          PY

          aws lambda invoke \
            --function-name daily-alpha-pine-ingress \
            --cli-binary-format raw-in-base64-out \
            --payload file:///tmp/ingress-event.json \
            /tmp/ingress-response.json >/tmp/invoke-meta.json

          SIGNAL_ID="${SIGNAL_ID}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(Path("/tmp/ingress-response.json").read_text())
          assert response["statusCode"] == 202, response
          body = json.loads(response["body"])
          assert body["status"] == "ACCEPTED", body
          assert body["signal_id"] == os.environ["SIGNAL_ID"], body
          assert body["trading_authorized"] is False
          assert body["live_trading_enabled"] is False
          print("Ingress accepted harmless shadow E2E signal.")
          PY

          PK="ACCOUNT#PAPER_SHADOW_V25#PINE_EVENT#${SIGNAL_ID}"
          export PK TABLE_NAME
          python - <<'PY' >/tmp/ddb-key.json
          import json
          import os
          print(json.dumps({"pk": {"S": os.environ["PK"]}, "sk": {"S": "RECEIVED"}}))
          PY

          found=0
          for _ in $(seq 1 30); do
            aws dynamodb get-item \
              --table-name "${TABLE_NAME}" \
              --key file:///tmp/ddb-key.json \
              --consistent-read \
              /tmp/ddb-item.json
            if python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("/tmp/ddb-item.json").read_text())
          item = data.get("Item", {})
          raise SystemExit(0 if item.get("execution_json", {}).get("S") else 1)
          PY
            then
              found=1
              break
            fi
            sleep 2
          done
          test "${found}" = "1"

          SIGNAL_ID="${SIGNAL_ID}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("/tmp/ddb-item.json").read_text())
          item = data["Item"]
          ingress = json.loads(item["ingress_json"]["S"])
          execution = json.loads(item["execution_json"]["S"])

          assert ingress["signal_id"] == os.environ["SIGNAL_ID"]
          assert ingress["model_id"] == "PAPER_SHADOW_V25"
          assert ingress["forward_test_start"] == "2026-08-19"
          assert "webhook_secret" not in ingress

          assert execution["disposition"] == "STATE_MISMATCH", execution
          assert execution["reason"] == "TRADINGVIEW_POSITION_NOT_IN_PAPER_LEDGER", execution
          assert execution["paper_account_id"] == "PAPER_SHADOW_V25", execution
          assert execution["model_id"] == "PAPER_SHADOW_V25", execution
          assert execution["paper_execution_triggered"] is False, execution
          assert execution["trading_authorized"] is False, execution
          assert execution["live_trading_enabled"] is False, execution
          print("Ingress -> SQS -> processor -> isolated V25 audit path verified; no fill created.")
          PY

          aws lambda invoke \
            --function-name daily-alpha-pine-processor \
            --cli-binary-format raw-in-base64-out \
            --payload '{"operation":"LIST_SHADOW_PAPER_POSITIONS"}' \
            /tmp/shadow-books.json >/tmp/books-meta.json

          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/shadow-books.json").read_text())
          assert result["ok"] is True
          assert result["trading_authorized"] is False
          assert result["live_trading_enabled"] is False
          assert set(result["books"]) == {"PAPER_SHADOW_V24", "PAPER_SHADOW_V25"}
          for book in result["books"].values():
              assert book.get("open_positions", []) == [], book
          print("Both shadow books remain FLAT after harmless E2E proof.")
          PY

          echo "signal_id=${SIGNAL_ID}" >> "${GITHUB_OUTPUT}"

      - name: Report successful E2E proof on PR 211
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNAL_ID: ${{ steps.e2e.outputs.signal_id }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues/211/comments \
            -f body="SHADOW STAGING E2E: SUCCESS ✅\n\nIngress -> SQS -> processor -> isolated PAPER_SHADOW_V25 audit path verified with harmless orphan ADD signal ${SIGNAL_ID}. Expected STATE_MISMATCH / TRADINGVIEW_POSITION_NOT_IN_PAPER_LEDGER observed. No paper fill was created. Both shadow books remain FLAT. DAILY_ALPHA_SHADOW_FORWARD_START=2026-08-19 verified. trading_authorized=false; live_trading_enabled=false.\n\nNext gate: rotate the compromised webhook secret, copy the new value directly into SH24/SH25 without exposing it, then perform the controlled TradingView-origin paper proof before enabling ongoing alerts."

      - name: Report failed E2E proof on PR 211
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api repos/${GITHUB_REPOSITORY}/issues/211/comments \
            -f body="SHADOW STAGING E2E: FAILED ❌\n\nThe harmless ingress -> SQS -> processor proof did not complete. No TradingView activation should occur. Inspect this workflow run before rotating/enabling shadow alerts. trading_authorized=false and live_trading_enabled=false remain required invariants."
