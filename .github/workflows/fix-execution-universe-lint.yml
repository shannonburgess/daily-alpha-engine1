name: Apply execution-universe lint fixes

on:
  push:
    branches: [agent/server-side-execution-universe]
    paths: [.github/workflows/fix-execution-universe-lint.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/server-side-execution-universe
      - name: Fix import order
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/daily_alpha/execution_universe.py")
          text = path.read_text(encoding="utf-8")
          old = "from pathlib import Path\nfrom collections.abc import Mapping"
          new = "from collections.abc import Mapping\nfrom pathlib import Path"
          if old not in text:
              raise SystemExit("Expected import block not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "daily-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/daily_alpha/execution_universe.py
          git commit -m "Fix execution-universe import order" || exit 0
          git push origin HEAD:agent/server-side-execution-universe
