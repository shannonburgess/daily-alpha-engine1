name: Apply execution-universe lint fixes

on:
  push:
    branches: [agent/server-side-execution-universe]
    paths: [.github/workflows/fix-execution-universe-lint.yml]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/server-side-execution-universe
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply Ruff autofix
        run: |
          python -m pip install ruff
          ruff check --fix src/daily_alpha/execution_universe.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "daily-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/daily_alpha/execution_universe.py
          git commit -m "Canonicalize execution-universe imports" || exit 0
          git push origin HEAD:agent/server-side-execution-universe
