name: Check RCMT Aug 17 09:45 underlying revalidation

on:
  push:
    branches: [agent/replay-2026-08-17-trades]
    paths: [.github/workflows/replay-rcmt-0945-stockdata.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      STOCKDATA_API_KEY: ${{ secrets.STOCKDATA_API_KEY }}
    steps:
      - name: Fetch RCMT historical minute bar and apply no-chase gate
        shell: python
        run: |
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import urlopen

          token = os.environ.get('STOCKDATA_API_KEY', '').strip()
          if not token:
              raise SystemExit('STOCKDATA_API_KEY missing')
          qs = urlencode({
              'symbols': 'RCMT',
              'api_token': token,
              'interval': 'minute',
              'date': '2026-08-17',
              'sort': 'asc',
              'extended_hours': 'false',
          })
          with urlopen('https://api.stockdata.org/v1/data/intraday?' + qs, timeout=30) as resp:
              payload = json.loads(resp.read().decode('utf-8'))
          rows = payload.get('data') or []
          target = None
          for row in rows:
              stamp = str(row.get('date', ''))
              if stamp.startswith('2026-08-17T13:45:'):
                  target = row
                  break
          if target is None:
              candidates = [r for r in rows if str(r.get('date','')) >= '2026-08-17T13:45:00' and not bool((r.get('data') or {}).get('is_extended_hours'))]
              target = candidates[0] if candidates else None
          if target is None:
              print(json.dumps({'status':'DATA_ERROR','reason':'RCMT_0945_BAR_NOT_FOUND','returned_rows':len(rows)}, indent=2))
              raise SystemExit(0)
          bar = target.get('data') or {}
          price = float(bar.get('close'))
          breakout = 29.55
          stop = 28.05
          entry = 35.05
          atr = 1.4040386448868847
          add1 = entry + atr
          if price <= max(stop, breakout):
              status = 'CANCEL_BREAKOUT_NO_LONGER_VALID'
          elif price >= add1:
              status = 'CANCEL_CHASE_ALREADY_AT_ADD1_LEVEL'
          else:
              status = 'ENTRY_PRICE_REVALIDATED'
          result = {
              'status': status,
              'timestamp': target.get('date'),
              'open': bar.get('open'),
              'high': bar.get('high'),
              'low': bar.get('low'),
              'close_used': price,
              'volume': bar.get('volume'),
              'friday_entry': entry,
              'breakout_level': breakout,
              'stop_level': stop,
              'atr': atr,
              'add1_no_chase_ceiling': add1,
              'stock_fallback_adv': 1280987.8375,
              'stock_fallback_min_adv': 50000000.0,
              'stock_fallback_eligible': False,
          }
          print(json.dumps(result, indent=2))
