name: Research R2 downside overlay

on:
  push:
    branches:
      - agent/r2-downside-overlay-phase1
    paths:
      - "research/run_r2_downside_overlay.py"
      - "research/run_r2_downside_overlay_total_return.py"
      - ".github/workflows/research-r2-downside-overlay.yml"
      - "src/daily_alpha/backtest.py"
  pull_request:
    branches:
      - main
    paths:
      - "research/run_r2_downside_overlay.py"
      - "research/run_r2_downside_overlay_total_return.py"
      - ".github/workflows/research-r2-downside-overlay.yml"
      - "src/daily_alpha/backtest.py"
  workflow_dispatch:

concurrency:
  group: daily-alpha-orats-heavy-research
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Compile research runners
        run: python -m py_compile research/run_r2_downside_overlay.py research/run_r2_downside_overlay_total_return.py
      - name: Run downside overlay study with treasury-reserve carry proxy
        run: python research/run_r2_downside_overlay_total_return.py
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: r2-downside-overlay-phase1
          path: r2-downside-overlay.json
          retention-days: 30
