name: Research R2 model search

on:
  push:
    branches: [agent/r2-model-search]
    paths:
      - research/run_r2_model_search.py
      - .github/workflows/research-r2-model-search.yml

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Run R2 model search
        run: python research/run_r2_model_search.py
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-r2-model-search
          path: |
            r2-model-search.json
            r2-model-search.md
          if-no-files-found: error
          retention-days: 30
