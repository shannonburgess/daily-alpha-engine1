name: Monitor Daily Alpha paper shadows

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * 1-5"

permissions:
  actions: read
  contents: read
  id-token: write
  issues: write

concurrency:
  group: daily-alpha-paper-shadow-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      AWS_REGION: us-east-2
      REPO: ${{ github.repository }}
      EVIDENCE_DIR: shadow-monitor-artifacts
      EXPECTED_SHADOW_FORWARD_START: "2026-08-19"
      STAGING_BUCKET: daily-alpha-staging-490809405132-us-east-2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-shadow-monitor
          aws-region: us-east-2

      - name: Capture sanitized staging runtime contract
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          aws lambda get-function-configuration \
            --function-name daily-alpha-pine-processor \
            --query '{function_name:FunctionName,state:State,last_update_status:LastUpdateStatus,last_modified:LastModified,forward_test_start:Environment.Variables.DAILY_ALPHA_SHADOW_FORWARD_START}' \
            --output json > "${EVIDENCE_DIR}/shadow-runtime-contract.json"
          jq --arg expected "${EXPECTED_SHADOW_FORWARD_START}" \
            '. + {expected_forward_test_start: $expected}' \
            "${EVIDENCE_DIR}/shadow-runtime-contract.json" \
            > "${EVIDENCE_DIR}/shadow-runtime-contract.tmp.json"
          mv "${EVIDENCE_DIR}/shadow-runtime-contract.tmp.json" \
            "${EVIDENCE_DIR}/shadow-runtime-contract.json"

      - name: Capture latest staging deployment health
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            "repos/${REPO}/actions/workflows/deploy-staging-lambdas.yml/runs?branch=main&per_page=1" \
            > "${EVIDENCE_DIR}/staging-deployment-status.raw.json"
          python - <<'PY'
          import json
          from pathlib import Path

          raw_path = Path("shadow-monitor-artifacts/staging-deployment-status.raw.json")
          payload = json.loads(raw_path.read_text())
          runs = payload.get("workflow_runs")
          if not isinstance(runs, list) or not runs:
              sanitized = {"found": False}
          else:
              run = runs[0]
              sanitized = {
                  "found": True,
                  "run_id": run.get("id"),
                  "run_number": run.get("run_number"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "head_sha": run.get("head_sha"),
                  "event": run.get("event"),
                  "run_started_at": run.get("run_started_at"),
                  "updated_at": run.get("updated_at"),
              }
          Path("shadow-monitor-artifacts/staging-deployment-status.json").write_text(
              json.dumps(sanitized, indent=2, sort_keys=True) + "\n"
          )
          raw_path.unlink()
          PY

      - name: Capture scheduled ARMED replay workflow health
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            "repos/${REPO}/actions/workflows/replay-paper-armed-signals.yml" \
            --jq '{name:.name,path:.path,state:.state,created_at:.created_at,updated_at:.updated_at}' \
            > "${EVIDENCE_DIR}/armed-replay-workflow-metadata.json"
          gh run list \
            --repo "${REPO}" \
            --workflow replay-paper-armed-signals.yml \
            --branch main \
            --limit 8 \
            --json databaseId,status,conclusion,createdAt,updatedAt,headSha,event \
            > "${EVIDENCE_DIR}/armed-replay-runs.json"

      - name: Capture sanitized backend ingress health
        run: |
          set -euo pipefail
          aws lambda get-function-configuration \
            --function-name daily-alpha-pine-ingress \
            --query '{function_name:FunctionName,state:State,last_update_status:LastUpdateStatus,last_modified:LastModified,secret_id:Environment.Variables.PINE_WEBHOOK_SECRET_ID,queue_url:Environment.Variables.PINE_INGRESS_QUEUE_URL}' \
            --output json > "${EVIDENCE_DIR}/shadow-ingress-runtime.raw.json"

          python - <<'PY'
          import json
          from pathlib import Path

          raw_path = Path("shadow-monitor-artifacts/shadow-ingress-runtime.raw.json")
          raw = json.loads(raw_path.read_text())
          queue_url = str(raw.get("queue_url") or "").strip()
          sanitized = {
              "function_name": raw.get("function_name"),
              "state": raw.get("state"),
              "last_update_status": raw.get("last_update_status"),
              "last_modified": raw.get("last_modified"),
              "secret_configured": bool(str(raw.get("secret_id") or "").strip()),
              "queue_configured": bool(queue_url),
              "queue_name": queue_url.rstrip("/").split("/")[-1] if queue_url else None,
          }
          Path("shadow-monitor-artifacts/shadow-ingress-runtime.json").write_text(
              json.dumps(sanitized, indent=2, sort_keys=True) + "\n"
          )
          raw_path.unlink()
          PY

      - name: Read isolated positions, ARMED state, events and receipts
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name daily-alpha-pine-processor \
            --cli-binary-format raw-in-base64-out \
            --payload '{"operation":"GET_SHADOW_MONITOR_STATE","armed_limit":25,"event_limit":100}' \
            "${EVIDENCE_DIR}/shadow-monitor-state.json" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path('shadow-monitor-artifacts/shadow-monitor-state.json').read_text())
          assert state.get('ok') is True, state
          assert state.get('trading_authorized') is False, state
          assert state.get('live_trading_enabled') is False, state
          assert set(state.get('books', {})) == {
              'PAPER_SHADOW_V24',
              'PAPER_SHADOW_V25',
          }, state
          print('Read-only shadow monitor API: PASS')
          PY

      - name: Capture latest canonical actionable universe
        run: |
          set -euo pipefail
          PREFIX="s3://${STAGING_BUCKET}/ovtlyr/shortlist/latest"
          aws s3 cp "${PREFIX}/summary.json" \
            "${EVIDENCE_DIR}/shortlist-summary.json" --only-show-errors
          aws s3 cp "${PREFIX}/shortlist.json" \
            "${EVIDENCE_DIR}/shortlist.json" --only-show-errors

      - name: Capture canonical company-liquidity evidence
        id: liquidity_evidence
        shell: bash
        run: |
          set -euo pipefail
          PREFIX="s3://${STAGING_BUCKET}/ovtlyr/shortlist/latest"
          if aws s3 cp \
            "${PREFIX}/company_liquidity_eligibility.json" \
            "${EVIDENCE_DIR}/company_liquidity_eligibility.json" \
            --only-show-errors 2>/tmp/liquidity-copy-error.log; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "${EVIDENCE_DIR}/company_liquidity_eligibility.json"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f /tmp/liquidity-copy-error.log

      - name: Capture latest SH24 source-diagnostic publication
        id: source_diagnostic_evidence
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_PUBLICATION="s3://${STAGING_BUCKET}/daily-alpha/shadow-diagnostics/sh24-source/latest/publication.json"
          if aws s3 cp \
            "${SOURCE_PUBLICATION}" \
            "${EVIDENCE_DIR}/sh24-source-publication.json" \
            --only-show-errors 2>/tmp/source-diagnostic-copy-error.log; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "${EVIDENCE_DIR}/sh24-source-publication.json"
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
          rm -f /tmp/source-diagnostic-copy-error.log

      - name: Build exact shadow, contract, replay, ingress, universe, liquidity and source-diagnostic status
        id: summarize
        shell: bash
        run: |
          set +e
          python scripts/shadow_monitor.py \
            --monitor-state "${EVIDENCE_DIR}/shadow-monitor-state.json" \
            --output-json "${EVIDENCE_DIR}/shadow-status.json" \
            --output-md "${EVIDENCE_DIR}/shadow-status.md"
          STATUS_CODE=$?

          python scripts/shadow_contract_monitor.py \
            --monitor-state "${EVIDENCE_DIR}/shadow-monitor-state.json" \
            --runtime-contract "${EVIDENCE_DIR}/shadow-runtime-contract.json" \
            --deployment-status "${EVIDENCE_DIR}/staging-deployment-status.json" \
            --output-json "${EVIDENCE_DIR}/shadow-contract-status.json" \
            --output-md "${EVIDENCE_DIR}/shadow-contract-status.md"
          CONTRACT_CODE=$?

          python scripts/shadow_replay_scheduler_monitor.py \
            --runs-json "${EVIDENCE_DIR}/armed-replay-runs.json" \
            --workflow-metadata "${EVIDENCE_DIR}/armed-replay-workflow-metadata.json" \
            --output-json "${EVIDENCE_DIR}/shadow-replay-scheduler-status.json" \
            --output-md "${EVIDENCE_DIR}/shadow-replay-scheduler-status.md"
          REPLAY_SCHEDULER_CODE=$?

          python scripts/shadow_transport_monitor.py \
            --ingress-runtime "${EVIDENCE_DIR}/shadow-ingress-runtime.json" \
            --output-json "${EVIDENCE_DIR}/shadow-transport-status.json" \
            --output-md "${EVIDENCE_DIR}/shadow-transport-status.md"
          TRANSPORT_CODE=$?

          python scripts/shadow_universe_monitor.py \
            --summary "${EVIDENCE_DIR}/shortlist-summary.json" \
            --shortlist "${EVIDENCE_DIR}/shortlist.json" \
            --output-json "${EVIDENCE_DIR}/shadow-universe-status.json" \
            --output-md "${EVIDENCE_DIR}/shadow-universe-status.md"
          UNIVERSE_CODE=$?

          LIQUIDITY_ARGS=(
            --summary "${EVIDENCE_DIR}/shortlist-summary.json"
            --shortlist "${EVIDENCE_DIR}/shortlist.json"
            --evidence-found "${{ steps.liquidity_evidence.outputs.found }}"
            --output-json "${EVIDENCE_DIR}/shadow-liquidity-status.json"
            --output-md "${EVIDENCE_DIR}/shadow-liquidity-status.md"
          )
          if [[ "${{ steps.liquidity_evidence.outputs.found }}" == "true" ]]; then
            LIQUIDITY_ARGS+=(
              --evidence "${EVIDENCE_DIR}/company_liquidity_eligibility.json"
            )
          fi
          python scripts/shadow_liquidity_monitor.py "${LIQUIDITY_ARGS[@]}"
          LIQUIDITY_CODE=$?

          SOURCE_DIAGNOSTIC_ARGS=(
            --output-json "${EVIDENCE_DIR}/shadow-source-diagnostic-status.json"
            --output-md "${EVIDENCE_DIR}/shadow-source-diagnostic-status.md"
          )
          if [[ "${{ steps.source_diagnostic_evidence.outputs.found }}" == "true" ]]; then
            SOURCE_DIAGNOSTIC_ARGS+=(
              --publication "${EVIDENCE_DIR}/sh24-source-publication.json"
            )
          fi
          python scripts/shadow_source_diagnostic_monitor.py "${SOURCE_DIAGNOSTIC_ARGS[@]}"
          SOURCE_DIAGNOSTIC_CODE=$?

          cat "${EVIDENCE_DIR}/shadow-contract-status.md" >> \
            "${EVIDENCE_DIR}/shadow-status.md"
          cat "${EVIDENCE_DIR}/shadow-replay-scheduler-status.md" >> \
            "${EVIDENCE_DIR}/shadow-status.md"
          cat "${EVIDENCE_DIR}/shadow-transport-status.md" >> \
            "${EVIDENCE_DIR}/shadow-status.md"
          cat "${EVIDENCE_DIR}/shadow-universe-status.md" >> \
            "${EVIDENCE_DIR}/shadow-status.md"
          cat "${EVIDENCE_DIR}/shadow-liquidity-status.md" >> \
            "${EVIDENCE_DIR}/shadow-status.md"
          cat "${EVIDENCE_DIR}/shadow-source-diagnostic-status.md" >> \
            "${EVIDENCE_DIR}/shadow-status.md"
          cat "${EVIDENCE_DIR}/shadow-status.md" >> "$GITHUB_STEP_SUMMARY"
          cat "${EVIDENCE_DIR}/shadow-status.json"
          cat "${EVIDENCE_DIR}/shadow-contract-status.json"
          cat "${EVIDENCE_DIR}/shadow-replay-scheduler-status.json"
          cat "${EVIDENCE_DIR}/shadow-transport-status.json"
          cat "${EVIDENCE_DIR}/shadow-universe-status.json"
          cat "${EVIDENCE_DIR}/shadow-liquidity-status.json"
          cat "${EVIDENCE_DIR}/shadow-source-diagnostic-status.json"

          if [ "${STATUS_CODE}" -ne 0 ] || \
             [ "${CONTRACT_CODE}" -ne 0 ] || \
             [ "${REPLAY_SCHEDULER_CODE}" -ne 0 ] || \
             [ "${TRANSPORT_CODE}" -ne 0 ] || \
             [ "${UNIVERSE_CODE}" -ne 0 ] || \
             [ "${LIQUIDITY_CODE}" -ne 0 ] || \
             [ "${SOURCE_DIAGNOSTIC_CODE}" -ne 0 ]; then
            CODE=2
          else
            CODE=0
          fi
          echo "exit_code=${CODE}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Update one rolling issue status
        if: always() && steps.summarize.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_DIR}/shadow-status.md"
          COMMENT_ID="$(gh api "repos/${REPO}/issues/213/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- daily-alpha-shadow-monitor -->")) | .id' \
            | head -n 1)"
          jq -Rs '{body:.}' "${EVIDENCE_DIR}/shadow-status.md" > "${EVIDENCE_DIR}/comment.json"
          if [ -n "${COMMENT_ID}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${COMMENT_ID}" \
              --input "${EVIDENCE_DIR}/comment.json" >/dev/null
          else
            gh api --method POST "repos/${REPO}/issues/213/comments" \
              --input "${EVIDENCE_DIR}/comment.json" >/dev/null
          fi

      - name: Upload monitor evidence
        if: always() && steps.summarize.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: paper-shadow-monitor-${{ github.run_id }}
          path: shadow-monitor-artifacts/
          retention-days: 30

      - name: Enforce fail-closed monitor result
        if: steps.summarize.outputs.exit_code != '0'
        run: |
          echo "Paper-shadow monitor detected a safety, isolation, evidence-completeness, staging-deployment, runtime-contract, ARMED-replay-scheduler, backend-ingress, canonical-universe, company-liquidity, or SH24 source-diagnostic violation."
          exit 1
