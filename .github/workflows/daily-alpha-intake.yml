name: Daily Alpha intake

on:
  workflow_dispatch:
  schedule:
    # Covers PST and PDT. The gate step permits only 05:30 and 14:30 America/Los_Angeles.
    - cron: "30 12,13,21,22 * * 1-5"

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-alpha-intake
  cancel-in-progress: false

jobs:
  intake:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVTLYR_FOLDER_URL: https://drive.google.com/drive/folders/1bt6x1-wszD4DqgvoZWd7UG9nyCWPc8Bj
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
      STAGING_BUCKET: daily-alpha-staging-490809405132-us-east-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Enforce Pacific schedule
        id: gate
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "session=MANUAL" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          from datetime import UTC, datetime
          from pathlib import Path
          import sys

          sys.path.insert(0, str(Path("src").resolve()))
          from daily_alpha.schedule import is_scheduled_run_time, scheduled_session

          now = datetime.now(UTC)
          print(f"run={'true' if is_scheduled_run_time(now) else 'false'}")
          print(f"session={scheduled_session(now) or 'SKIP'}")
          PY
          fi

      - name: Check ORATS secret
        if: steps.gate.outputs.run == 'true'
        id: orats_secret
        shell: bash
        run: |
          if [[ -n "$ORATS_TOKEN" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ORATS_TOKEN GitHub secret is missing; OVTLYR intake will still be persisted, but ORATS enrichment must remain DATA_ERROR."
          fi

      - name: Install intake tools
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install --disable-pip-version-check . gdown==5.2.0

      - name: Download public OVTLYR folder
        if: steps.gate.outputs.run == 'true'
        run: |
          mkdir -p data/incoming
          gdown --folder --remaining-ok "$OVTLYR_FOLDER_URL" -O data/incoming

      - name: Validate and normalize newest OVTLYR CSV
        if: steps.gate.outputs.run == 'true'
        id: ovtlyr
        shell: python
        run: |
          import os
          from pathlib import Path

          from daily_alpha.sources import OvtlyrInbox
          from daily_alpha.staging_snapshot import write_ovtlyr_snapshot

          selected = OvtlyrInbox("data/incoming").latest()
          destination = Path("data/staging/ovtlyr-latest.json")
          snapshot = write_ovtlyr_snapshot(
              selected.path,
              destination,
              observed_at=selected.observed_at,
          )
          print(
              f"Selected {selected.path.name} ({selected.size_bytes} bytes); "
              f"normalized {snapshot['record_count']} symbols and "
              f"{snapshot['buy_count']} BUY signals"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"source_path={selected.path}\n")
              handle.write(f"snapshot_path={destination}\n")

      - name: Configure short-lived AWS credentials
        if: steps.gate.outputs.run == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-intake-publish
          aws-region: us-east-2

      - name: Publish validated OVTLYR snapshot to AWS staging
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          SOURCE="${{ steps.ovtlyr.outputs.source_path }}"
          SNAPSHOT="${{ steps.ovtlyr.outputs.snapshot_path }}"
          PREFIX="s3://${STAGING_BUCKET}/ovtlyr"
          HISTORY="${PREFIX}/history/${GITHUB_RUN_ID}"

          aws s3 cp "$SOURCE" "${PREFIX}/latest.csv" --only-show-errors
          aws s3 cp "$SNAPSHOT" "${PREFIX}/latest.json" --only-show-errors
          aws s3 cp "$SOURCE" "${HISTORY}/source.csv" --only-show-errors
          aws s3 cp "$SNAPSHOT" "${HISTORY}/snapshot.json" --only-show-errors
          echo "Published validated OVTLYR snapshot to ${PREFIX}/latest.json"

      - name: Upload validated intake
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ovtlyr-intake-${{ github.run_id }}
          path: |
            data/incoming/*.csv
            data/staging/ovtlyr-latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify ORATS connectivity and freshness
        if: >-
          steps.gate.outputs.run == 'true' &&
          steps.gate.outputs.session != 'MORNING' &&
          steps.orats_secret.outputs.available == 'true'
        id: orats
        continue-on-error: true
        run: |
          python - <<'PY'
          from daily_alpha.orats import OratsClient

          chain = OratsClient(mode="delayed").fetch_chain("SPY")
          print(
              f"ORATS verified for {chain.ticker}: "
              f"{len(chain.candidates)} contracts at {chain.observed_at.isoformat()}"
          )
          PY

      - name: Report ORATS availability
        if: >-
          always() &&
          steps.gate.outputs.run == 'true' &&
          steps.gate.outputs.session != 'MORNING'
        shell: bash
        run: |
          if [[ "${{ steps.orats_secret.outputs.available }}" != "true" ]]; then
            echo "::warning::ORATS unavailable because the GitHub secret is missing. No option or stock fallback decision may be authorized from this condition."
          elif [[ "${{ steps.orats.outcome }}" == "failure" ]]; then
            echo "::warning::ORATS connectivity/freshness check failed. OVTLYR data was persisted, but downstream option selection must remain DATA_ERROR and must not substitute stock."
          else
            echo "ORATS connectivity and freshness check passed."
          fi
