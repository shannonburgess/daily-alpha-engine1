name: Deploy Daily Alpha staging Lambdas

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/daily_alpha/**"
      - "lambda_handlers/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-staging-lambdas.yml"

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    name: Test and deploy staging Lambdas
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run quality gates
        run: |
          ruff check .
          pytest -q

      - name: Build Lambda deployment package
        run: |
          rm -rf build deployment.zip
          mkdir -p build
          pip install . --target build --no-deps
          cp -R lambda_handlers build/lambda_handlers
          (cd build && zip -qr ../deployment.zip .)
          unzip -l deployment.zip | grep -E "lambda_handlers/(engine|report|paper_trader|pine_webhook|pine_processor)\.py"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-staging-deploy
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy engine
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-engine \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-engine
          aws lambda update-function-configuration \
            --function-name daily-alpha-engine \
            --handler lambda_handlers.engine.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-engine

      - name: Deploy report service
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-report \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-report
          aws lambda update-function-configuration \
            --function-name daily-alpha-report \
            --handler lambda_handlers.report.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-report

      - name: Deploy paper trader
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-paper-trader \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-paper-trader
          aws lambda update-function-configuration \
            --function-name daily-alpha-paper-trader \
            --handler lambda_handlers.paper_trader.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-paper-trader

      - name: Deploy Pine ingress
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-pine-ingress \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-pine-ingress
          aws lambda update-function-configuration \
            --function-name daily-alpha-pine-ingress \
            --handler lambda_handlers.pine_webhook.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-pine-ingress

      - name: Deploy Pine processor
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-pine-processor \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-pine-processor
          aws lambda update-function-configuration \
            --function-name daily-alpha-pine-processor \
            --handler lambda_handlers.pine_processor.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-pine-processor

      - name: Verify deployed configuration
        run: |
          aws lambda get-function-configuration --function-name daily-alpha-engine \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-report \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-paper-trader \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-pine-ingress \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-pine-processor \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
