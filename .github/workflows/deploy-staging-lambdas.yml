name: Deploy Daily Alpha staging Lambdas

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/daily_alpha/**"
      - "lambda_handlers/**"
      - "scripts/render_forward_parity_deploy_receipt.py"
      - "pyproject.toml"
      - ".github/workflows/deploy-staging-lambdas.yml"

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: daily-alpha-staging-lambda-deploy
  cancel-in-progress: false

jobs:
  test-and-deploy:
    name: Test and deploy staging Lambdas
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run quality gates
        run: |
          ruff check .
          pytest -q

      - name: Verify forward parity projection ancestry
        shell: bash
        run: |
          set -euo pipefail
          PROJECTION_MINIMUM_COMMIT="32b4626a9b1138d4a1e9788f533d6a06ac5f929a"
          git merge-base --is-ancestor "$PROJECTION_MINIMUM_COMMIT" "$GITHUB_SHA"
          echo "PARITY_PROJECTION_ANCESTOR_VERIFIED=true" >> "$GITHUB_ENV"

      - name: Build Lambda deployment package
        run: |
          rm -rf build deployment.zip
          mkdir -p build
          pip install . --target build --no-deps
          cp -R lambda_handlers build/lambda_handlers
          (cd build && zip -qr ../deployment.zip .)
          unzip -l deployment.zip | grep -E "lambda_handlers/(engine|report|paper_trader|pine_webhook|pine_processor)\.py"

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-staging-deploy
          aws-region: us-east-2

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Deploy engine
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-engine \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-engine
          aws lambda update-function-configuration \
            --function-name daily-alpha-engine \
            --handler lambda_handlers.engine.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-engine

      - name: Deploy report service
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-report \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-report
          aws lambda update-function-configuration \
            --function-name daily-alpha-report \
            --handler lambda_handlers.report.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-report

      - name: Deploy paper trader
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-paper-trader \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-paper-trader
          aws lambda update-function-configuration \
            --function-name daily-alpha-paper-trader \
            --handler lambda_handlers.paper_trader.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-paper-trader

      - name: Deploy Pine ingress
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-pine-ingress \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-pine-ingress
          aws lambda update-function-configuration \
            --function-name daily-alpha-pine-ingress \
            --handler lambda_handlers.pine_webhook.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-pine-ingress

      - name: Deploy Pine processor
        run: |
          aws lambda update-function-code \
            --function-name daily-alpha-pine-processor \
            --zip-file fileb://deployment.zip \
            --publish
          aws lambda wait function-updated --function-name daily-alpha-pine-processor
          aws lambda update-function-configuration \
            --function-name daily-alpha-pine-processor \
            --handler lambda_handlers.pine_processor.lambda_handler
          aws lambda wait function-updated --function-name daily-alpha-pine-processor

      - name: Verify deployed configuration
        run: |
          aws lambda get-function-configuration --function-name daily-alpha-engine \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-report \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-paper-trader \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-pine-ingress \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-pine-processor \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,LastUpdateStatus:LastUpdateStatus}'
          aws lambda get-function-configuration --function-name daily-alpha-pine-processor \
            --query '{FunctionName:FunctionName,Handler:Handler,Runtime:Runtime,Version:Version,CodeSha256:CodeSha256,LastUpdateStatus:LastUpdateStatus}' \
            > /tmp/pine-processor-config.json

      - name: Verify deployed shadow monitor contract
        shell: bash
        run: |
          cat >/tmp/shadow-monitor-request.json <<'JSON'
          {"operation":"GET_SHADOW_MONITOR_STATE","armed_limit":25,"event_limit":100}
          JSON
          aws lambda invoke \
            --function-name daily-alpha-pine-processor \
            --cli-binary-format raw-in-base64-out \
            --payload file:///tmp/shadow-monitor-request.json \
            /tmp/shadow-monitor-result.json
          cat /tmp/shadow-monitor-result.json

      - name: Validate shadow routing and monitor readiness
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/shadow-monitor-result.json").read_text())
          assert result["ok"] is True
          assert result["service"] == "daily-alpha-pine-processor"
          assert result["operation"] == "GET_SHADOW_MONITOR_STATE"
          assert result["trading_authorized"] is False
          assert result["live_trading_enabled"] is False
          books = result["books"]
          assert set(books) == {"PAPER_SHADOW_V24", "PAPER_SHADOW_V25"}
          for account_id in ("PAPER_SHADOW_V24", "PAPER_SHADOW_V25"):
              book = books[account_id]
              assert isinstance(book["open_count"], int)
              assert isinstance(book["open_positions"], list)
              assert isinstance(book["armed_count_visible"], int)
              assert isinstance(book["armed_signals"], list)
              assert isinstance(book["events"], list)
          print(
              "Shadow monitor readiness passed: V24/V25 isolation and read-only "
              "monitor contract are present after deployment."
          )

      - name: Rehearse paper processor fail-closed safety gate
        shell: bash
        run: |
          python - <<'PY' >/tmp/fail-closed-entry.json
          import json
          from datetime import UTC, datetime

          now = datetime.now(UTC).isoformat()
          print(json.dumps({
              "operation": "EXECUTE_SCANNER_SIGNAL",
              "signal": {
                  "source": "DAILY_ALPHA_SCANNER",
                  "signal_id": "STAGING-READINESS-SPY-UNVERIFIED-SECTOR",
                  "symbol": "SPY",
                  "action": "ENTRY_LONG",
                  "strategy": "DA_TURTLE_ADAPTIVE_TREND",
                  "strategy_version": "2.4",
                  "timeframe": "D",
                  "price": 100.0,
                  "bar_time": now,
                  "entry_type": "NORMAL_BREAKOUT",
                  "sector": "Unknown",
                  "stock_stop_price": 95.0,
                  "average_daily_dollar_volume": 1000000000.0
              }
          }))
          PY
          aws lambda invoke \
            --function-name daily-alpha-pine-processor \
            --cli-binary-format raw-in-base64-out \
            --payload file:///tmp/fail-closed-entry.json \
            /tmp/fail-closed-result.json
          cat /tmp/fail-closed-result.json

      - name: Validate paper-only readiness response
        shell: python
        run: |
          import json
          from pathlib import Path

          result = json.loads(Path("/tmp/fail-closed-result.json").read_text())
          assert result["ok"] is True
          assert result["trading_authorized"] is False
          assert result["live_trading_enabled"] is False
          execution = result["execution"]
          assert execution["disposition"] == "NO_TRADE"
          assert execution["reason"] in {
              "SECTOR_DATA_UNVERIFIED",
              "LIQUIDITY_FILTERED",
              "ACTIONABLE_UNIVERSE_FILTERED",
          }
          assert execution["paper_execution_triggered"] is False
          if execution["reason"] == "LIQUIDITY_FILTERED":
              detail = execution["context"]["liquidity_gate"]["detail"]
              assert detail == "LIQUIDITY_SYMBOL_EVIDENCE_MISSING_OR_DUPLICATE"
          print(
              "Staging readiness passed: autonomous paper execution remains live-disabled "
              "and fails closed before a paper fill."
          )

      - name: Render sanitized forward parity deployment receipt
        run: |
          python scripts/render_forward_parity_deploy_receipt.py \
            --monitor /tmp/shadow-monitor-result.json \
            --processor-config /tmp/pine-processor-config.json \
            --output-json /tmp/forward-parity-deploy-receipt.json \
            --output-markdown /tmp/forward-parity-deploy-receipt.md
          cat /tmp/forward-parity-deploy-receipt.json

      - name: Publish forward parity deployment receipt to issue 213
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 213 \
            --repo "$GITHUB_REPOSITORY" \
            --body-file /tmp/forward-parity-deploy-receipt.md
