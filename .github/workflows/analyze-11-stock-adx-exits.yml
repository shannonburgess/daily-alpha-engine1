name: Analyze 11-stock ADX and runner exit grid

on:
  push:
    branches: [agent/analyze-11-stock-adx-exits]
    paths: [.github/workflows/analyze-11-stock-adx-exits.yml]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Run 11-stock grid
        shell: python
        run: |
          import json
          import math
          import os
          from datetime import date
          from pathlib import Path

          from daily_alpha.backtest import fetch_orats_history, indicators

          token = os.environ.get('ORATS_TOKEN', '').strip()
          if not token:
              raise SystemExit('ORATS_TOKEN missing')

          symbols = ['LRCX','MU','FTI','IRM','RCMT','HUBB','ALGN','HUM','MRK','PSX','VLO']
          start = date(2026, 3, 1)
          end = date(2026, 7, 31)
          adx_modes = ['17_RISING', '20', '25']
          exit_modes = ['CURRENT_BE', 'NO_BE_TURTLE_TREND', 'TRAIL_2ATR', 'TRAIL_3ATR']

          def adx_threshold(mode):
              return 17.0 if mode == '17_RISING' else float(mode)

          def entry_adx_ok(mode, rows, i):
              value = rows[i]['adx']
              if value is None:
                  return False
              value = float(value)
              threshold = adx_threshold(mode)
              if value < threshold:
                  return False
              if mode != '17_RISING':
                  return True
              if i <= 0 or rows[i - 1]['adx'] is None:
                  return False
              return value > float(rows[i - 1]['adx'])

          def runner_adx_ok(mode, row):
              return row['adx'] is not None and float(row['adx']) >= adx_threshold(mode)

          def run_variant(bars, ind, adx_mode, exit_mode):
              qty = 0.0
              avg_cost = 0.0
              entry_breakout = None
              entry_bar = None
              base_entry = None
              base_atr = None
              add1_done = add2_done = harvest_done = False
              add1_bar = add2_bar = None
              current = None
              runner_floor = None
              highest_close_after_harvest = None
              trades = []

              for i, (bar, row) in enumerate(zip(bars, ind)):
                  in_window = start <= bar.trade_date <= end
                  flat = qty == 0
                  price_ok = bar.close >= 25.0
                  eff_ok = row['efficiency'] is not None and float(row['efficiency']) >= 0.20
                  rsi_ok = row['rsi'] is not None and float(row['rsi']) <= 80.0
                  entry_adx = entry_adx_ok(adx_mode, ind, i)

                  normal_setup = (
                      in_window and flat and bool(row['fresh_breakout'])
                      and not bool(row['is_earnings_up_gap'])
                      and int(row['trend_state']) == 1
                      and bool(row['normal_trend_mature'])
                  )
                  normal_entry = normal_setup and price_ok and eff_ok and rsi_ok and entry_adx
                  gap_entry = (
                      in_window and flat and bool(row['gap_go'])
                      and bool(row['fresh_breakout']) and price_ok
                  )
                  long_entry = normal_entry or gap_entry
                  entry_type = 'EARNINGS_GAP_GO' if gap_entry else 'NORMAL_BREAKOUT' if normal_entry else 'NONE'

                  if long_entry:
                      entry_breakout = float(row['upper20'])
                      entry_bar = i
                      base_entry = bar.close
                      base_atr = float(row['atr']) if row['atr'] is not None else None
                      add1_done = add2_done = harvest_done = False
                      add1_bar = add2_bar = None
                      runner_floor = None
                      highest_close_after_harvest = None

                  bars_since = i - entry_bar if entry_bar is not None else None
                  failed_exit = (
                      qty > 0 and entry_breakout is not None and bars_since is not None
                      and 1 <= bars_since <= 3 and bar.close < entry_breakout
                  )
                  runner_trend_ok = int(row['trend_state']) == 1 and runner_adx_ok(adx_mode, row)
                  add1 = (
                      qty > 0 and not add1_done and base_entry is not None and base_atr is not None
                      and runner_trend_ok and bar.close >= base_entry + base_atr
                  )
                  if add1:
                      add1_done = True
                      add1_bar = i
                  add2 = (
                      qty > 0 and add1_done and not add2_done and add1_bar is not None and i > add1_bar
                      and base_entry is not None and base_atr is not None and runner_trend_ok
                      and bar.close >= base_entry + 2.0 * base_atr
                  )
                  if add2:
                      add2_done = True
                      add2_bar = i
                  harvest = (
                      qty > 0 and add2_done and not harvest_done and add2_bar is not None and i > add2_bar
                      and base_entry is not None and base_atr is not None
                      and bar.close >= base_entry + 3.0 * base_atr
                  )
                  if harvest:
                      harvest_done = True
                      highest_close_after_harvest = bar.close
                      if exit_mode == 'CURRENT_BE':
                          runner_floor = avg_cost
                      elif exit_mode == 'TRAIL_2ATR':
                          runner_floor = bar.close - 2.0 * base_atr
                      elif exit_mode == 'TRAIL_3ATR':
                          runner_floor = bar.close - 3.0 * base_atr
                      else:
                          runner_floor = None

                  if harvest_done and highest_close_after_harvest is not None:
                      highest_close_after_harvest = max(highest_close_after_harvest, bar.close)
                      if exit_mode == 'TRAIL_2ATR' and base_atr is not None:
                          runner_floor = highest_close_after_harvest - 2.0 * base_atr
                      elif exit_mode == 'TRAIL_3ATR' and base_atr is not None:
                          runner_floor = highest_close_after_harvest - 3.0 * base_atr

                  runner_floor_exit = (
                      qty > 0 and harvest_done and runner_floor is not None and bar.close <= runner_floor
                  )
                  turtle_exit = qty > 0 and row['lower10'] is not None and bar.close < float(row['lower10'])
                  trend_exit = qty > 0 and bool(row['bear_flip'])
                  long_exit = in_window and (runner_floor_exit or failed_exit or turtle_exit or trend_exit)
                  if runner_floor_exit:
                      if exit_mode == 'CURRENT_BE':
                          exit_reason = 'BREAK_EVEN'
                      else:
                          exit_reason = exit_mode
                  elif failed_exit:
                      exit_reason = 'FAILED_BREAKOUT'
                  elif turtle_exit:
                      exit_reason = 'TURTLE_10'
                  elif trend_exit:
                      exit_reason = 'TREND_FLIP'
                  else:
                      exit_reason = ''

                  if long_entry:
                      qty = 2.0
                      avg_cost = bar.close
                      current = {
                          'entry_date': bar.trade_date.isoformat(),
                          'entry_price': bar.close,
                          'entry_type': entry_type,
                          'entry_adx': row['adx'],
                          'entry_rsi': row['rsi'],
                          'entry_efficiency': row['efficiency'],
                          'entry_upper20': row['upper20'],
                          'gross_cost': 2.0 * bar.close,
                          'realized_pnl': 0.0,
                          'adds': 0,
                          'harvested': False,
                      }

                  if add1 and current is not None:
                      new_qty = qty + 1.0
                      avg_cost = (avg_cost * qty + bar.close) / new_qty
                      qty = new_qty
                      current['gross_cost'] += bar.close
                      current['adds'] += 1
                  if add2 and current is not None:
                      new_qty = qty + 1.0
                      avg_cost = (avg_cost * qty + bar.close) / new_qty
                      qty = new_qty
                      current['gross_cost'] += bar.close
                      current['adds'] += 1
                  if harvest and current is not None and qty >= 1.0:
                      current['realized_pnl'] += bar.close - avg_cost
                      qty -= 1.0
                      current['harvested'] = True
                      current['harvest_date'] = bar.trade_date.isoformat()
                      current['harvest_price'] = bar.close

                  if long_exit and current is not None and qty > 0:
                      current['realized_pnl'] += (bar.close - avg_cost) * qty
                      current['exit_date'] = bar.trade_date.isoformat()
                      current['exit_price'] = bar.close
                      current['exit_reason'] = exit_reason
                      current['return_pct'] = current['realized_pnl'] / current['gross_cost'] * 100.0
                      trades.append(current)
                      qty = 0.0
                      avg_cost = 0.0
                      entry_breakout = entry_bar = base_entry = base_atr = None
                      add1_done = add2_done = harvest_done = False
                      add1_bar = add2_bar = None
                      current = None
                      runner_floor = None
                      highest_close_after_harvest = None

              if current is not None and qty > 0:
                  last = max((b for b in bars if b.trade_date <= end), key=lambda b: b.trade_date)
                  current['realized_pnl'] += (last.close - avg_cost) * qty
                  current['exit_date'] = last.trade_date.isoformat()
                  current['exit_price'] = last.close
                  current['exit_reason'] = 'MARK_TO_END'
                  current['return_pct'] = current['realized_pnl'] / current['gross_cost'] * 100.0
                  trades.append(current)

              gross = sum(float(t['gross_cost']) for t in trades)
              pnl = sum(float(t['realized_pnl']) for t in trades)
              compounded = 1.0
              for trade in trades:
                  compounded *= 1.0 + float(trade['return_pct']) / 100.0
              compounded_pct = (compounded - 1.0) * 100.0 if trades else 0.0
              return {
                  'adx_mode': adx_mode,
                  'exit_mode': exit_mode,
                  'trade_count': len(trades),
                  'wins': sum(1 for t in trades if float(t['realized_pnl']) > 0),
                  'win_rate_pct': (sum(1 for t in trades if float(t['realized_pnl']) > 0) / len(trades) * 100.0) if trades else 0.0,
                  'total_pnl_units': pnl,
                  'gross_deployed_units': gross,
                  'aggregate_return_pct_on_gross': (pnl / gross * 100.0) if gross else 0.0,
                  'compounded_trade_return_pct': compounded_pct,
                  'trades': trades,
              }

          output = {
              'window': [start.isoformat(), end.isoformat()],
              'definitions': {
                  '17_RISING': 'ADX >=17 and current ADX > prior-day ADX for entry; adds require ADX >=17',
                  '20': 'ADX >=20',
                  '25': 'ADX >=25 (current v2.4 threshold)',
                  'CURRENT_BE': 'After +3 ATR harvest, close remaining runner if close <= average cost',
                  'NO_BE_TURTLE_TREND': 'After +3 ATR harvest, no break-even floor; remaining runner exits only on Turtle-10 or adaptive trend flip (plus existing failed-breakout rule in first 3 bars)',
                  'TRAIL_2ATR': 'After +3 ATR harvest, trail remaining runner at highest close since harvest minus 2 base ATR',
                  'TRAIL_3ATR': 'After +3 ATR harvest, trail remaining runner at highest close since harvest minus 3 base ATR',
              },
              'symbols': {},
          }

          for symbol in symbols:
              record = {'symbol': symbol}
              try:
                  bars, meta = fetch_orats_history(symbol, start=date(2026,1,1), end=end, token=token)
                  ind = indicators(bars)
                  window_bars = [b for b in bars if start <= b.trade_date <= end]
                  if not window_bars:
                      raise RuntimeError('NO_WINDOW_BARS')
                  record['source'] = meta[0].get('source') if meta else 'ORATS'
                  record['start_close'] = window_bars[0].close
                  record['end_close'] = window_bars[-1].close
                  record['buy_hold_return_pct'] = (window_bars[-1].close / window_bars[0].close - 1.0) * 100.0
                  variants = []
                  for adx_mode in adx_modes:
                      for exit_mode in exit_modes:
                          variants.append(run_variant(bars, ind, adx_mode, exit_mode))
                  record['variants'] = variants
                  current = next(v for v in variants if v['adx_mode'] == '25' and v['exit_mode'] == 'CURRENT_BE')
                  tradable = [v for v in variants if v['trade_count'] > 0]
                  best = max(tradable, key=lambda v: (v['aggregate_return_pct_on_gross'], v['compounded_trade_return_pct'])) if tradable else current
                  record['current_v24'] = current
                  record['best_variant'] = best
                  record['improvement_pct_points'] = best['aggregate_return_pct_on_gross'] - current['aggregate_return_pct_on_gross']
              except Exception as exc:
                  record['data_error'] = f'{type(exc).__name__}:{exc}'
              output['symbols'][symbol] = record

          valid = [r for r in output['symbols'].values() if 'data_error' not in r]
          output['portfolio_summary'] = {
              'valid_symbols': len(valid),
              'data_errors': {s:r['data_error'] for s,r in output['symbols'].items() if 'data_error' in r},
              'current_mean_return_pct': sum(r['current_v24']['aggregate_return_pct_on_gross'] for r in valid) / len(valid) if valid else 0.0,
              'best_mean_return_pct': sum(r['best_variant']['aggregate_return_pct_on_gross'] for r in valid) / len(valid) if valid else 0.0,
              'best_mode_counts': {},
          }
          counts = {}
          for r in valid:
              key = r['best_variant']['adx_mode'] + '|' + r['best_variant']['exit_mode']
              counts[key] = counts.get(key, 0) + 1
          output['portfolio_summary']['best_mode_counts'] = counts

          Path('analysis-11-stock-grid.json').write_text(json.dumps(output, indent=2, default=str), encoding='utf-8')
          summary_lines = [
              '# 11-stock ADX / post-3ATR exit comparison',
              '',
              '| Symbol | Buy&hold | Current v2.4 | Best grid | Best ADX | Best runner exit | Improvement | Trades/Wins |',
              '|---|---:|---:|---:|---|---|---:|---:|',
          ]
          for symbol in symbols:
              r = output['symbols'][symbol]
              if 'data_error' in r:
                  summary_lines.append(f"| {symbol} |  |  | DATA_ERROR |  |  |  |  |")
                  continue
              c = r['current_v24']
              b = r['best_variant']
              summary_lines.append(
                  f"| {symbol} | {r['buy_hold_return_pct']:.2f}% | {c['aggregate_return_pct_on_gross']:.2f}% | "
                  f"{b['aggregate_return_pct_on_gross']:.2f}% | {b['adx_mode']} | {b['exit_mode']} | "
                  f"{r['improvement_pct_points']:+.2f}pp | {b['trade_count']}/{b['wins']} |"
              )
          summary_lines += [
              '',
              f"Current v2.4 mean: {output['portfolio_summary']['current_mean_return_pct']:.2f}%",
              f"Best-per-symbol mean: {output['portfolio_summary']['best_mean_return_pct']:.2f}%",
              'Best mode counts: ' + json.dumps(counts, sort_keys=True),
          ]
          Path('analysis-11-stock-grid.md').write_text('\n'.join(summary_lines) + '\n', encoding='utf-8')
          print(Path('analysis-11-stock-grid.md').read_text())
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-11-stock-adx-exit-grid
          path: |
            analysis-11-stock-grid.json
            analysis-11-stock-grid.md
          if-no-files-found: error
          retention-days: 30
