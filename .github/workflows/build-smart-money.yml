name: Build Daily Alpha smart money

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-alpha-smart-money
  cancel-in-progress: false

env:
  STAGING_BUCKET: daily-alpha-staging-490809405132-us-east-2
  STOCKDATA_API_KEY: ${{ secrets.STOCKDATA_API_KEY }}

jobs:
  smart-money:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require Smart Money API secret
        shell: bash
        run: |
          if [[ -z "$STOCKDATA_API_KEY" ]]; then
            echo "STOCKDATA_API_KEY GitHub secret is missing" >&2
            exit 1
          fi

      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .

      - name: Build Top 5 congressional and institutional accumulation
        id: smart_money
        shell: python
        run: |
          import os
          from datetime import UTC, datetime

          from daily_alpha.smart_money import (
              build_smart_money_snapshot,
              rank_congressional_acquisitions,
              rank_institutional_acquisitions,
              write_smart_money_outputs,
          )
          from daily_alpha.stockdata_smart_money import StockDataSmartMoneyClient

          now = datetime.now(UTC)
          today = now.date()
          client = StockDataSmartMoneyClient()

          congress_trades = client.fetch_congressional_purchases(days=90, limit=500)
          congressional = rank_congressional_acquisitions(
              congress_trades,
              as_of=today,
              lookback_days=90,
              limit=5,
          )
          current, previous, institutional_coverage = client.fetch_institutional_holdings_pair(
              as_of=today,
              institution_limit=25,
              portfolio_limit=500,
          )
          institutional = rank_institutional_acquisitions(
              current,
              previous,
              limit=5,
          )

          coverage = {
              "provider": "STOCKDATA_DEV_AUTHENTICATED",
              "congress_source": "HOUSE_AND_SENATE_STOCK_ACT_DISCLOSURES",
              "congress_lookback_days": 90,
              "congress_trade_rows": len(congress_trades),
              "congress_status": "AVAILABLE",
              "institutional_source": "SEC_FORM_13F_NORMALIZED_BY_STOCKDATA_DEV",
              "institutional_scope": "TOP_25_INSTITUTIONS_BY_PORTFOLIO_VALUE",
              "institutional_current_period": institutional_coverage.current_period,
              "institutional_previous_period": institutional_coverage.previous_period,
              "institutional_managers_requested": institutional_coverage.institutions_requested,
              "institutional_current_rows": institutional_coverage.current_rows,
              "institutional_previous_rows": institutional_coverage.previous_rows,
              "institutional_portfolio_limit_per_manager": institutional_coverage.portfolio_limit,
              "institutional_status": "AVAILABLE",
          }

          if not congressional:
              coverage["congress_status"] = "NO_QUALIFIED_PURCHASES"
          if not institutional:
              coverage["institutional_status"] = "NO_POSITIVE_QOQ_ACCUMULATION"
          if not congressional and not institutional:
              raise SystemExit("Both smart-money rankings are empty; refusing an empty success")

          snapshot = build_smart_money_snapshot(
              generated_at=now,
              congressional=congressional,
              institutional=institutional,
              coverage=coverage,
          )
          outputs = write_smart_money_outputs("data/smart-money/output", snapshot)
          assert all(path.exists() for path in outputs.values())

          print("Top congressional accumulation:")
          for item in congressional:
              print(
                  f"{item.rank}. {item.symbol} {item.issuer} score={item.score:.2f} "
                  f"politicians={item.unique_politicians} purchases={item.purchase_count}"
              )
          print("Top institutional accumulation:")
          for item in institutional:
              print(
                  f"{item.rank}. {item.symbol} {item.issuer} score={item.score:.2f} "
                  f"managers_increasing={item.managers_increasing} new={item.new_manager_positions}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"congress_count={len(congressional)}\n")
              handle.write(f"institution_count={len(institutional)}\n")
              handle.write(
                  "congress_top=" + ", ".join(item.symbol for item in congressional) + "\n"
              )
              handle.write(
                  "institution_top=" + ", ".join(item.symbol for item in institutional) + "\n"
              )
              handle.write(
                  "current_13f_period=" + institutional_coverage.current_period + "\n"
              )
              handle.write(
                  "previous_13f_period=" + institutional_coverage.previous_period + "\n"
              )

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-smart-money-publish
          aws-region: us-east-2

      - name: Publish smart money snapshot to AWS staging
        shell: bash
        run: |
          PREFIX="s3://${STAGING_BUCKET}/ovtlyr/smart-money"
          HISTORY="${PREFIX}/history/${GITHUB_RUN_ID}"
          for FILE in data/smart-money/output/*; do
            NAME="$(basename "$FILE")"
            aws s3 cp "$FILE" "${PREFIX}/latest/${NAME}" --only-show-errors
            aws s3 cp "$FILE" "${HISTORY}/${NAME}" --only-show-errors
          done
          echo "Published smart-money snapshot to ${PREFIX}/latest/"

      - name: Upload smart money artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-smart-money-${{ github.run_id }}
          path: data/smart-money/output/*
          if-no-files-found: error
          retention-days: 30

      - name: Summarize smart money build
        shell: bash
        run: |
          {
            echo "## Daily Alpha Smart Money"
            echo "- Provider: authenticated normalized public-disclosure data"
            echo "- Congressional Top 5 rows: ${{ steps.smart_money.outputs.congress_count }}"
            echo "- Congressional leaders: ${{ steps.smart_money.outputs.congress_top }}"
            echo "- Institutional Top 5 rows: ${{ steps.smart_money.outputs.institution_count }}"
            echo "- Institutional leaders: ${{ steps.smart_money.outputs.institution_top }}"
            echo "- 13F comparison: ${{ steps.smart_money.outputs.previous_13f_period }} -> ${{ steps.smart_money.outputs.current_13f_period }}"
            echo "- Institutional scope: top 25 major 13F managers, up to 500 reported holdings each."
            echo "- Research confirmation only; no paper or live trade was authorized."
          } >> "$GITHUB_STEP_SUMMARY"
