name: Apply next-session execution architecture patch

on:
  push:
    branches: [agent/next-session-paper-execution]
    paths: [.github/workflows/patch-next-session-execution.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/next-session-paper-execution
          fetch-depth: 20
      - name: Recover and run patch payload from prior commit
        shell: bash
        run: |
          git show dc4d3937d58ff5718e8cdb20b0c10f17a42c0bc2:.github/workflows/patch-next-session-execution.yml > /tmp/old-patch.yml
          python - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/old-patch.yml').read_text(encoding='utf-8').splitlines()
          target = '      - name: Patch ORATS stock price and execution workflow'
          start = lines.index(target)
          run_index = next(i for i in range(start, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run_index + 1, len(lines)) if lines[i].startswith('      - name: Commit architecture patch'))
          payload = []
          for line in lines[run_index + 1:end]:
              payload.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/patch.py').write_text('\n'.join(payload) + '\n', encoding='utf-8')
          PY
          python /tmp/patch.py
      - name: Commit architecture patch
        shell: bash
        run: |
          git config user.name "daily-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/daily_alpha/orats.py tests/test_orats.py .github/workflows/scan-execution-universe.yml
          git commit -m "Stage close signals and execute next session"
          git push origin HEAD:agent/next-session-paper-execution
