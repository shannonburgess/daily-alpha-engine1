name: Apply next-session execution architecture patch

on:
  push:
    branches: [agent/next-session-paper-execution]
    paths: [.github/workflows/patch-next-session-execution.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/next-session-paper-execution
      - name: Patch ORATS stock price and execution workflow
        shell: python
        run: |
          from pathlib import Path

          orats = Path('src/daily_alpha/orats.py')
          text = orats.read_text(encoding='utf-8')
          replacements = [
              (
                  '''class OratsChain:\n    ticker: str\n    candidates: tuple[OptionCandidate, ...]\n    observed_at: datetime\n    source_mode: str''',
                  '''class OratsChain:\n    ticker: str\n    stock_price: float\n    candidates: tuple[OptionCandidate, ...]\n    observed_at: datetime\n    source_mode: str''',
              ),
              (
                  '''        observed_at = self._latest_observation(rows)\n        reference = as_of or datetime.now(UTC)''',
                  '''        observed_at = self._latest_observation(rows)\n        stock_price = self._latest_stock_price(rows)\n        reference = as_of or datetime.now(UTC)''',
              ),
              (
                  '''        return OratsChain(\n            ticker=symbol,\n            candidates=candidates,''',
                  '''        return OratsChain(\n            ticker=symbol,\n            stock_price=stock_price,\n            candidates=candidates,''',
              ),
              (
                  '''    @staticmethod\n    def _normalize_rows(\n        ticker: str,''',
                  '''    @staticmethod\n    def _latest_stock_price(rows: list[Mapping[str, Any]]) -> float:\n        observations: list[tuple[datetime, float]] = []\n        for row in rows:\n            stamp = row.get("updatedAt") or row.get("quoteDate") or row.get("snapShotDate")\n            raw_price = row.get("stockPrice")\n            if raw_price in (None, ""):\n                raw_price = row.get("spotPrice")\n            if not stamp or raw_price in (None, ""):\n                continue\n            price = _number(raw_price)\n            if price > 0:\n                observations.append((_parse_timestamp(str(stamp)), price))\n        if not observations:\n            raise OratsDataError("ORATS response has no positive underlying stock price")\n        return max(observations, key=lambda item: item[0])[1]\n\n    @staticmethod\n    def _normalize_rows(\n        ticker: str,''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'ORATS patch target not found: {old[:80]!r}')
              text = text.replace(old, new, 1)
          orats.write_text(text, encoding='utf-8')

          test = Path('tests/test_orats.py')
          text = test.read_text(encoding='utf-8')
          old = '''                "strike": 250,\n                "callBidPrice": 5.0,'''
          new = '''                "strike": 250,\n                "stockPrice": 220.25,\n                "callBidPrice": 5.0,'''
          if old not in text:
              raise SystemExit('ORATS test payload target not found')
          text = text.replace(old, new, 1)
          old = '''    assert chain.ticker == "AAPL"\n    assert len(chain.candidates) == 2'''
          new = '''    assert chain.ticker == "AAPL"\n    assert chain.stock_price == 220.25\n    assert len(chain.candidates) == 2'''
          if old not in text:
              raise SystemExit('ORATS test assertion target not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')

          wf = Path('.github/workflows/scan-execution-universe.yml')
          text = wf.read_text(encoding='utf-8')

          old = '''  schedule:\n    # Covers EDT/EST. Gate below permits only 16:20 America/New_York.\n    - cron: "20 20,21 * * 1-5"'''
          new = '''  schedule:\n    # Close signal staging: 16:20 ET. Morning execution: 09:45 ET, with a\n    # 10:05 ET retry window only for transient DATA_ERROR items.\n    - cron: "20 20,21 * * 1-5"\n    - cron: "45 13,14 * * 1-5"\n    - cron: "5 14,15 * * 1-5"'''
          if old not in text:
              raise SystemExit('Schedule target not found')
          text = text.replace(old, new, 1)

          old = '''    outputs:\n      run: ${{ steps.market.outputs.run }}'''
          new = '''    outputs:\n      run: ${{ steps.market.outputs.run }}\n      mode: ${{ steps.market.outputs.mode }}'''
          if old not in text:
              raise SystemExit('Gate outputs target not found')
          text = text.replace(old, new, 1)

          old = '''      - name: Resolve US market-close execution window\n        id: market\n        shell: bash\n        run: |\n          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then\n            echo "run=true" >> "$GITHUB_OUTPUT"\n          else\n            python3 - <<'PY' >> "$GITHUB_OUTPUT"\n          from datetime import UTC, datetime\n          from zoneinfo import ZoneInfo\n          local = datetime.now(UTC).astimezone(ZoneInfo("America/New_York"))\n          print("run=true" if local.hour == 16 and 15 <= local.minute <= 40 else "run=false")\n          PY\n          fi'''
          new = '''      - name: Resolve US signal-staging / execution window\n        id: market\n        shell: bash\n        run: |\n          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then\n            echo "run=true" >> "$GITHUB_OUTPUT"\n            echo "mode=close_signal" >> "$GITHUB_OUTPUT"\n          else\n            python3 - <<'PY' >> "$GITHUB_OUTPUT"\n          from datetime import UTC, datetime\n          from zoneinfo import ZoneInfo\n          local = datetime.now(UTC).astimezone(ZoneInfo("America/New_York"))\n          if local.hour == 16 and 15 <= local.minute <= 40:\n              print("run=true")\n              print("mode=close_signal")\n          elif local.hour == 9 and 40 <= local.minute <= 59:\n              print("run=true")\n              print("mode=morning_primary")\n          elif local.hour == 10 and 0 <= local.minute <= 20:\n              print("run=true")\n              print("mode=morning_retry")\n          else:\n              print("run=false")\n              print("mode=none")\n          PY\n          fi'''
          if old not in text:
              raise SystemExit('Gate body target not found')
          text = text.replace(old, new, 1)

          old = '''    if: needs.gate.outputs.run == 'true'\n    environment: staging'''
          new = '''    if: needs.gate.outputs.run == 'true' && needs.gate.outputs.mode == 'close_signal'\n    environment: staging'''
          if old not in text:
              raise SystemExit('Close job guard target not found')
          text = text.replace(old, new, 1)

          old = '''          from daily_alpha.execution_universe import (\n              ScannerState,\n              evaluate_latest_v24,\n              execution_succeeded,\n              load_state,\n              select_execution_universe,\n              write_state,\n          )'''
          new = '''          from daily_alpha.execution_queue import build_pending_action\n          from daily_alpha.execution_universe import (\n              ScannerState,\n              evaluate_latest_v24,\n              load_state,\n              select_execution_universe,\n              write_state,\n          )'''
          if old not in text:
              raise SystemExit('Close imports target not found')
          text = text.replace(old, new, 1)

          old = '''          executed = 0\n\n          for index, symbol in enumerate(symbols, start=1):'''
          new = '''          executed = 0\n          pending = []\n\n          for index, symbol in enumerate(symbols, start=1):'''
          if old not in text:
              raise SystemExit('Pending init target not found')
          text = text.replace(old, new, 1)

          old = '''                  outcome = None\n                  if decision.signal is not None:\n                      emitted += 1\n                      outcome = invoke(\n                          {\n                              "operation": "EXECUTE_SCANNER_SIGNAL",\n                              "signal": decision.signal,\n                          }\n                      )\n                      if outcome.get("ok") is not True:\n                          raise RuntimeError(f"Scanner execution rejected at boundary: {outcome}")\n                      execution = outcome.get("execution", {})\n                      if execution_succeeded(execution):\n                          executed += 1\n                          if decision.action == "EXIT":\n                              state.pop(symbol, None)\n                              if symbol in open_symbols:\n                                  open_symbols.remove(symbol)\n                          elif decision.proposed_state is not None:\n                              state[symbol] = decision.proposed_state\n                              if decision.action == "ENTRY_LONG" and symbol not in open_symbols:\n                                  open_symbols.append(symbol)\n                      decision_payload["processor"] = outcome\n                  decisions.append(decision_payload)\n                  execution_label = ""\n                  if outcome:\n                      execution_label = str(outcome.get("execution", {}).get("disposition", ""))'''
          new = '''                  outcome = None\n                  if decision.signal is not None:\n                      emitted += 1\n                      pending_item = build_pending_action(\n                          symbol=symbol,\n                          action=decision.action or "",\n                          reason=decision.reason,\n                          signal=decision.signal,\n                          market_date=decision.market_bar_date,\n                          created_at=now,\n                          state_before=symbol_state,\n                          state_after=decision.proposed_state,\n                      )\n                      pending.append(pending_item)\n                      decision_payload["pending"] = {\n                          "status": "PENDING_NEXT_SESSION",\n                          "execution_timing": "NEXT_REGULAR_SESSION",\n                      }\n                  decisions.append(decision_payload)\n                  execution_label = (\n                      "PENDING_NEXT_SESSION" if decision.signal is not None else ""\n                  )'''
          if old not in text:
              raise SystemExit('Immediate execution block target not found')
          text = text.replace(old, new, 1)

          old = '''              "paper_actions_executed": executed,\n              "data_error_count": data_errors,'''
          new = '''              "paper_actions_executed": executed,\n              "pending_next_session_actions": len(pending),\n              "data_error_count": data_errors,'''
          if old not in text:
              raise SystemExit('Audit pending count target not found')
          text = text.replace(old, new, 1)

          old = '''          audit_path = work / "audit.json"\n          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True), encoding="utf-8")\n          watch_json = work / "active_watch.json"'''
          new = '''          audit_path = work / "audit.json"\n          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True), encoding="utf-8")\n          pending_path = work / "pending_actions.json"\n          pending_path.write_text(\n              json.dumps(\n                  {\n                      "schema_version": "2026-08-17-pending-v1",\n                      "generated_at": now.isoformat(),\n                      "market_date": trade_date.isoformat(),\n                      "actions": pending,\n                  },\n                  indent=2,\n                  sort_keys=True,\n              ),\n              encoding="utf-8",\n          )\n          watch_json = work / "active_watch.json"'''
          if old not in text:
              raise SystemExit('Pending file target not found')
          text = text.replace(old, new, 1)

          old = '''          for path in (state_path, audit_path, watch_json, watch_csv):'''
          new = '''          for path in (state_path, audit_path, pending_path, watch_json, watch_csv):'''
          if old not in text:
              raise SystemExit('S3 upload file list target not found')
          text = text.replace(old, new, 1)

          old = '''              handle.write(f"executed={executed}\\n")\n              handle.write(f"data_errors={data_errors}\\n")'''
          new = '''              handle.write(f"executed={executed}\\n")\n              handle.write(f"pending={len(pending)}\\n")\n              handle.write(f"data_errors={data_errors}\\n")'''
          if old not in text:
              raise SystemExit('Outputs pending target not found')
          text = text.replace(old, new, 1)

          old = '''              "market_date", "symbols_monitored", "signals_emitted",\n              "paper_actions_executed", "data_error_count", "open_symbols"'''
          new = '''              "market_date", "symbols_monitored", "signals_emitted",\n              "paper_actions_executed", "pending_next_session_actions",\n              "data_error_count", "open_symbols"'''
          if old not in text:
              raise SystemExit('Printed audit target not found')
          text = text.replace(old, new, 1)

          old = '''            echo "- Paper actions executed: ${{ steps.scan.outputs.executed }}"\n            echo "- Open paper positions after scan: ${{ steps.scan.outputs.open_count }}"'''
          new = '''            echo "- After-close paper actions executed: ${{ steps.scan.outputs.executed }} (must remain 0)"\n            echo "- Pending next-session actions: ${{ steps.scan.outputs.pending }}"\n            echo "- Open paper positions after scan: ${{ steps.scan.outputs.open_count }}"'''
          if old not in text:
              raise SystemExit('Summary pending target not found')
          text = text.replace(old, new, 1)

          append = r'''

  execute-pending:
    needs: gate
    if: >-
      needs.gate.outputs.run == 'true' &&
      (needs.gate.outputs.mode == 'morning_primary' || needs.gate.outputs.mode == 'morning_retry')
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
      STAGING_BUCKET: daily-alpha-staging-490809405132-us-east-2
      EXECUTION_MODE: ${{ needs.gate.outputs.mode }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Require ORATS secret
        shell: bash
        run: |
          if [[ -z "$ORATS_TOKEN" ]]; then
            echo "ORATS_TOKEN GitHub secret is missing" >&2
            exit 1
          fi

      - name: Install execution scanner
        run: python -m pip install --disable-pip-version-check . boto3

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-next-session-execution
          aws-region: us-east-2

      - name: Revalidate pending actions and execute during regular session
        id: execute
        shell: python
        run: |
          import csv
          import json
          import os
          import time
          from datetime import UTC, datetime
          from pathlib import Path

          import boto3
          from botocore.exceptions import ClientError

          from daily_alpha.execution_queue import (
              CANCEL_STATUS,
              WAIT_STATUS,
              prepare_next_session_signal,
          )
          from daily_alpha.execution_universe import (
              ScannerState,
              execution_succeeded,
              load_state,
              write_state,
          )
          from daily_alpha.orats import OratsClient, OratsError

          bucket = os.environ["STAGING_BUCKET"]
          token = os.environ["ORATS_TOKEN"]
          mode = os.environ["EXECUTION_MODE"]
          retry_window = mode == "morning_retry"
          run_id = os.environ["GITHUB_RUN_ID"]
          now = datetime.now(UTC)
          s3 = boto3.client("s3")
          lamb = boto3.client("lambda")
          work = Path("data/execution-universe-morning")
          work.mkdir(parents=True, exist_ok=True)
          pending_path = work / "pending_actions.json"
          state_path = work / "state.json"
          watch_json = work / "active_watch.json"

          def download_optional(key, path, default):
              try:
                  s3.download_file(bucket, key, str(path))
              except ClientError as exc:
                  code = exc.response.get("Error", {}).get("Code", "")
                  if code not in {"404", "NoSuchKey", "NotFound"}:
                      raise
                  path.write_text(json.dumps(default), encoding="utf-8")

          download_optional(
              "daily-alpha/execution-universe/latest/pending_actions.json",
              pending_path,
              {"schema_version": "2026-08-17-pending-v1", "actions": []},
          )
          download_optional(
              "daily-alpha/execution-universe/latest/state.json",
              state_path,
              {},
          )
          download_optional(
              "daily-alpha/execution-universe/latest/active_watch.json",
              watch_json,
              [],
          )

          pending_doc = json.loads(pending_path.read_text(encoding="utf-8"))
          actions = list(pending_doc.get("actions") or [])
          state = load_state(state_path)
          try:
              watch = json.loads(watch_json.read_text(encoding="utf-8"))
              if not isinstance(watch, list):
                  watch = []
          except json.JSONDecodeError:
              watch = []
          watch_by_symbol = {
              str(row.get("symbol", "")).upper(): row
              for row in watch
              if isinstance(row, dict) and row.get("symbol")
          }

          def invoke(payload):
              response = lamb.invoke(
                  FunctionName="daily-alpha-pine-processor",
                  InvocationType="RequestResponse",
                  Payload=json.dumps(payload).encode("utf-8"),
              )
              raw = response["Payload"].read().decode("utf-8")
              body = json.loads(raw or "{}")
              if response.get("FunctionError"):
                  raise RuntimeError(f"Pine processor FunctionError: {body}")
              if body.get("live_trading_enabled") is not False:
                  raise RuntimeError(f"Unsafe live trading response: {body}")
              return body

          attempted = 0
          executed = 0
          cancelled = 0
          retries = 0
          remaining = []
          attempts = []

          for item in actions:
              symbol = str(item.get("symbol", "")).upper()
              action = str(item.get("action", "")).upper()
              if not symbol or not action:
                  continue
              attempted += 1
              record = {
                  "symbol": symbol,
                  "action": action,
                  "origin_market_date": item.get("market_date"),
                  "mode": mode,
              }
              try:
                  chain = OratsClient(
                      token=token,
                      mode="delayed",
                      max_age_minutes=25,
                  ).fetch_chain(symbol, as_of=now)
                  record["orats_observed_at"] = chain.observed_at.isoformat()
                  record["stock_price"] = chain.stock_price
                  prepared = prepare_next_session_signal(
                      item,
                      stock_price=chain.stock_price,
                      now=now,
                  )
                  record["revalidation"] = prepared.to_dict()
                  if prepared.status == WAIT_STATUS:
                      remaining.append(item)
                      attempts.append(record)
                      continue
                  if prepared.status == CANCEL_STATUS:
                      cancelled += 1
                      record["final_status"] = "CANCELLED"
                      attempts.append(record)
                      row = watch_by_symbol.setdefault(symbol, {"symbol": symbol})
                      row["scanner_status"] = prepared.reason
                      row["execution"] = "CANCELLED_NEXT_SESSION"
                      continue

                  outcome = invoke(
                      {
                          "operation": "EXECUTE_SCANNER_SIGNAL",
                          "signal": prepared.signal,
                      }
                  )
                  record["processor"] = outcome
                  if outcome.get("ok") is not True:
                      error = str(outcome.get("error_code", "PROCESSOR_REJECTED"))
                      raise RuntimeError(error)
                  execution = outcome.get("execution", {})
                  if execution_succeeded(execution):
                      executed += 1
                      record["final_status"] = "EXECUTED_PAPER"
                      if action == "EXIT":
                          state.pop(symbol, None)
                      else:
                          after = item.get("state_after")
                          if isinstance(after, dict):
                              state[symbol] = ScannerState.from_dict(after)
                      row = watch_by_symbol.setdefault(symbol, {"symbol": symbol})
                      row["position"] = "FLAT" if action == "EXIT" else "OPEN"
                      current = state.get(symbol)
                      row["runner_stage"] = current.runner_stage if current else ""
                      row["scanner_status"] = "NEXT_SESSION_REVALIDATED"
                      row["execution"] = "EXECUTED_PAPER"
                  else:
                      cancelled += 1
                      record["final_status"] = str(
                          execution.get("disposition", "NO_TRADE")
                      )
                      record["reason"] = execution.get("reason")
                      row = watch_by_symbol.setdefault(symbol, {"symbol": symbol})
                      row["scanner_status"] = str(execution.get("reason", "NO_TRADE"))
                      row["execution"] = str(execution.get("disposition", "NO_TRADE"))
                  attempts.append(record)
              except (OratsError, RuntimeError, ValueError, TypeError) as exc:
                  record["error"] = f"{type(exc).__name__}:{exc}"
                  if not retry_window:
                      retry_item = dict(item)
                      retry_item["status"] = "RETRY_DATA_ERROR"
                      retry_item["attempt_count"] = int(item.get("attempt_count", 0)) + 1
                      remaining.append(retry_item)
                      retries += 1
                      record["final_status"] = "RETRY_DATA_ERROR"
                  else:
                      cancelled += 1
                      record["final_status"] = "EXPIRED_DATA_ERROR"
                  attempts.append(record)
                  row = watch_by_symbol.setdefault(symbol, {"symbol": symbol})
                  row["scanner_status"] = record["final_status"]
                  row["execution"] = record["final_status"]
              time.sleep(0.35)

          write_state(state_path, state)
          pending_doc["last_execution_attempt_at"] = now.isoformat()
          pending_doc["actions"] = remaining
          pending_path.write_text(
              json.dumps(pending_doc, indent=2, sort_keys=True), encoding="utf-8"
          )

          watch = sorted(
              watch_by_symbol.values(),
              key=lambda row: (
                  int(row.get("rank")) if str(row.get("rank", "")).isdigit() else 999999,
                  str(row.get("symbol", "")),
              ),
          )
          watch_json.write_text(json.dumps(watch, indent=2, sort_keys=True), encoding="utf-8")
          watch_csv = work / "active_watch.csv"
          fields = [
              "rank", "symbol", "label", "position", "runner_stage",
              "scanner_status", "action", "execution",
          ]
          with watch_csv.open("w", newline="", encoding="utf-8") as handle:
              writer = csv.DictWriter(handle, fieldnames=fields, extrasaction="ignore")
              writer.writeheader()
              writer.writerows(watch)

          audit = {
              "schema_version": "2026-08-17-next-session-v1",
              "generated_at": now.isoformat(),
              "execution_mode": mode,
              "attempted": attempted,
              "executed_paper": executed,
              "cancelled_or_no_trade": cancelled,
              "retry_data_error": retries,
              "remaining_pending": len(remaining),
              "live_trading_enabled": False,
              "attempts": attempts,
          }
          audit_path = work / "morning_execution_audit.json"
          audit_path.write_text(json.dumps(audit, indent=2, sort_keys=True), encoding="utf-8")

          latest = "daily-alpha/execution-universe/latest"
          history = f"daily-alpha/execution-universe/history/{run_id}-morning"
          for path in (state_path, pending_path, watch_json, watch_csv, audit_path):
              s3.upload_file(str(path), bucket, f"{latest}/{path.name}")
              s3.upload_file(str(path), bucket, f"{history}/{path.name}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"attempted={attempted}\n")
              handle.write(f"executed={executed}\n")
              handle.write(f"cancelled={cancelled}\n")
              handle.write(f"retries={retries}\n")
              handle.write(f"remaining={len(remaining)}\n")

          print(json.dumps(audit, indent=2))

      - name: Upload next-session execution audit
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-next-session-${{ github.run_id }}
          path: data/execution-universe-morning/*
          if-no-files-found: error
          retention-days: 30

      - name: Summarize next-session paper execution
        shell: bash
        run: |
          {
            echo "## Daily Alpha next-session paper execution"
            echo "- Window: ${{ needs.gate.outputs.mode }}"
            echo "- Pending actions attempted: ${{ steps.execute.outputs.attempted }}"
            echo "- Paper actions executed: ${{ steps.execute.outputs.executed }}"
            echo "- Cancelled / no-trade: ${{ steps.execute.outputs.cancelled }}"
            echo "- DATA_ERROR retries: ${{ steps.execute.outputs.retries }}"
            echo "- Remaining pending: ${{ steps.execute.outputs.remaining }}"
            echo "- Entry revalidation: breakout must remain valid and price must remain below +1 ATR add level"
            echo "- ORATS underlying and option data: refreshed before execution"
            echo "- Live trading: DISABLED"
          } >> "$GITHUB_STEP_SUMMARY"
'''
          if '  execute-pending:' in text:
              raise SystemExit('Morning execution job already exists')
          text = text.rstrip() + append + '\n'
          wf.write_text(text, encoding='utf-8')
      - name: Commit architecture patch
        shell: bash
        run: |
          git config user.name "daily-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/daily_alpha/orats.py tests/test_orats.py .github/workflows/scan-execution-universe.yml
          git commit -m "Stage close signals and execute next session"
          git push origin HEAD:agent/next-session-paper-execution
