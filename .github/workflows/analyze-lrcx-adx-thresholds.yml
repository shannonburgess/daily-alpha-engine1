name: Analyze LRCX ADX thresholds

on:
  push:
    branches: [agent/analyze-lrcx-adx-thresholds]
    paths: [.github/workflows/analyze-lrcx-adx-thresholds.yml]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Compare ADX 17 20 25
        shell: python
        run: |
          import json
          import os
          from datetime import date

          from daily_alpha.backtest import fetch_orats_history, indicators

          token = os.environ['ORATS_TOKEN']
          start = date(2026, 3, 1)
          end = date(2026, 7, 31)
          bars, _ = fetch_orats_history('LRCX', start=date(2026,1,1), end=end, token=token)
          ind = indicators(bars)

          def run(adx_min):
              qty = 0.0
              avg_cost = 0.0
              entry_breakout = None
              entry_bar = None
              base_entry = None
              base_atr = None
              add1_done = add2_done = harvest_done = False
              add1_bar = add2_bar = None
              break_even = None
              current = None
              trades = []
              entries = []

              for i, (bar, row) in enumerate(zip(bars, ind)):
                  in_window = start <= bar.trade_date <= end
                  flat = qty == 0
                  price_ok = bar.close >= 25
                  eff_ok = row['efficiency'] is not None and float(row['efficiency']) >= 0.20
                  rsi_ok = row['rsi'] is not None and float(row['rsi']) <= 80
                  adx_ok = row['adx'] is not None and float(row['adx']) >= adx_min

                  normal_setup = (
                      in_window and flat and bool(row['fresh_breakout'])
                      and not bool(row['is_earnings_up_gap'])
                      and int(row['trend_state']) == 1
                      and bool(row['normal_trend_mature'])
                  )
                  normal_entry = normal_setup and price_ok and eff_ok and rsi_ok and adx_ok
                  gap_entry = in_window and flat and bool(row['gap_go']) and bool(row['fresh_breakout']) and price_ok
                  long_entry = normal_entry or gap_entry
                  entry_type = 'EARNINGS_GAP_GO' if gap_entry else 'NORMAL_BREAKOUT' if normal_entry else 'NONE'

                  if long_entry:
                      entry_breakout = float(row['upper20'])
                      entry_bar = i
                      base_entry = bar.close
                      base_atr = float(row['atr'])
                      add1_done = add2_done = harvest_done = False
                      add1_bar = add2_bar = None
                      break_even = None

                  bars_since = i - entry_bar if entry_bar is not None else None
                  failed_exit = qty > 0 and entry_breakout is not None and bars_since is not None and 1 <= bars_since <= 3 and bar.close < entry_breakout
                  runner_trend_ok = int(row['trend_state']) == 1 and adx_ok
                  add1 = qty > 0 and not add1_done and base_entry is not None and base_atr is not None and runner_trend_ok and bar.close >= base_entry + base_atr
                  if add1:
                      add1_done = True
                      add1_bar = i
                  add2 = qty > 0 and add1_done and not add2_done and add1_bar is not None and i > add1_bar and base_entry is not None and base_atr is not None and runner_trend_ok and bar.close >= base_entry + 2*base_atr
                  if add2:
                      add2_done = True
                      add2_bar = i
                  harvest = qty > 0 and add2_done and not harvest_done and add2_bar is not None and i > add2_bar and base_entry is not None and base_atr is not None and bar.close >= base_entry + 3*base_atr
                  if harvest:
                      break_even = avg_cost
                      harvest_done = True
                  be_exit = qty > 0 and harvest_done and break_even is not None and bar.close <= break_even
                  turtle_exit = qty > 0 and row['lower10'] is not None and bar.close < float(row['lower10'])
                  trend_exit = qty > 0 and bool(row['bear_flip'])
                  long_exit = in_window and (be_exit or failed_exit or turtle_exit or trend_exit)
                  exit_reason = 'BREAK_EVEN' if be_exit else 'FAILED_BREAKOUT' if failed_exit else 'TURTLE_10' if turtle_exit else 'TREND_FLIP' if trend_exit else ''

                  if long_entry:
                      qty = 2.0
                      avg_cost = bar.close
                      current = {
                          'entry_date': bar.trade_date.isoformat(),
                          'entry_price': bar.close,
                          'entry_type': entry_type,
                          'gross_cost': 2*bar.close,
                          'realized_pnl': 0.0,
                          'adds': 0,
                          'harvested': False,
                          'adx': row['adx'],
                          'rsi': row['rsi'],
                          'efficiency': row['efficiency'],
                          'upper20': row['upper20'],
                      }
                      entries.append(dict(current))

                  if add1 and current is not None:
                      new_qty = qty + 1
                      avg_cost = (avg_cost*qty + bar.close)/new_qty
                      qty = new_qty
                      current['gross_cost'] += bar.close
                      current['adds'] += 1
                  if add2 and current is not None:
                      new_qty = qty + 1
                      avg_cost = (avg_cost*qty + bar.close)/new_qty
                      qty = new_qty
                      current['gross_cost'] += bar.close
                      current['adds'] += 1
                  if harvest and current is not None and qty >= 1:
                      current['realized_pnl'] += (bar.close-avg_cost)
                      qty -= 1
                      current['harvested'] = True
                  if long_exit and current is not None and qty > 0:
                      current['realized_pnl'] += (bar.close-avg_cost)*qty
                      current['exit_date'] = bar.trade_date.isoformat()
                      current['exit_price'] = bar.close
                      current['exit_reason'] = exit_reason
                      current['return_pct'] = current['realized_pnl']/current['gross_cost']*100
                      trades.append(current)
                      qty = 0.0
                      avg_cost = 0.0
                      entry_breakout = entry_bar = base_entry = base_atr = None
                      add1_done = add2_done = harvest_done = False
                      add1_bar = add2_bar = None
                      break_even = None
                      current = None

              if current is not None and qty > 0:
                  last = max((b for b in bars if b.trade_date <= end), key=lambda b:b.trade_date)
                  current['realized_pnl'] += (last.close-avg_cost)*qty
                  current['exit_date'] = last.trade_date.isoformat()
                  current['exit_price'] = last.close
                  current['exit_reason'] = 'MARK_TO_END'
                  current['return_pct'] = current['realized_pnl']/current['gross_cost']*100
                  trades.append(current)

              gross = sum(t['gross_cost'] for t in trades)
              pnl = sum(t['realized_pnl'] for t in trades)
              return {
                  'adx_min': adx_min,
                  'first_entry': entries[0] if entries else None,
                  'entries': entries,
                  'trades': trades,
                  'trade_count': len(trades),
                  'wins': sum(1 for t in trades if t['realized_pnl'] > 0),
                  'total_pnl_units': pnl,
                  'aggregate_return_pct_on_gross': (pnl/gross*100 if gross else 0),
              }

          result = {str(x): run(x) for x in (17,20,25)}
          print(json.dumps(result, indent=2, default=str))
        
