name: Prove FRED initial-release staging evidence

on:
  workflow_dispatch:
    inputs:
      targets:
        description: Comma-separated FRED series IDs (max 20; e.g. DFF,DGS10,VIXCLS)
        required: true
        default: DFF,DGS10,VIXCLS
        type: string
      start_date:
        description: Inclusive observation start date (YYYY-MM-DD)
        required: true
        type: string
      end_date:
        description: Inclusive observation end date (YYYY-MM-DD; max 31 calendar days)
        required: true
        type: string
      confirm:
        description: Type PROVE_FRED to capture and verify real staging evidence
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-alpha-staging-fred-initial-release-proof
  cancel-in-progress: false

jobs:
  prove-fred-initial-release:
    name: Prove immutable FRED initial-release evidence
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out exact authoritative main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require current main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "main"
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run repository quality gates
        run: |
          ruff check .
          pytest -q

      - name: Validate proof request locally
        shell: python
        env:
          INPUT_TARGETS: ${{ inputs.targets }}
          INPUT_START_DATE: ${{ inputs.start_date }}
          INPUT_END_DATE: ${{ inputs.end_date }}
          INPUT_CONFIRM: ${{ inputs.confirm }}
        run: |
          import json
          import os
          import re
          from datetime import UTC, date, datetime
          from pathlib import Path

          if os.environ['INPUT_CONFIRM'].strip() != 'PROVE_FRED':
              raise SystemExit('FRED_PROOF_CONFIRMATION_REQUIRED')

          targets = tuple(
              item.strip().upper()
              for item in os.environ['INPUT_TARGETS'].split(',')
              if item.strip()
          )
          if not targets or len(targets) > 20:
              raise SystemExit('FRED_PROOF_TARGET_COUNT_OUT_OF_RANGE')
          if len(set(targets)) != len(targets):
              raise SystemExit('FRED_PROOF_TARGETS_MUST_BE_UNIQUE')
          target_re = re.compile(r'^[A-Z0-9.^_-]{1,32}$')
          if any(not target_re.fullmatch(item) for item in targets):
              raise SystemExit('FRED_PROOF_TARGET_INVALID')

          try:
              start_date = date.fromisoformat(os.environ['INPUT_START_DATE'].strip())
              end_date = date.fromisoformat(os.environ['INPUT_END_DATE'].strip())
          except ValueError as exc:
              raise SystemExit('FRED_PROOF_DATE_INVALID') from exc
          if start_date > end_date:
              raise SystemExit('FRED_PROOF_DATE_RANGE_INVALID')
          if end_date > datetime.now(UTC).date():
              raise SystemExit('FRED_PROOF_END_DATE_IN_FUTURE')
          if (end_date - start_date).days + 1 > 31:
              raise SystemExit('FRED_PROOF_DATE_RANGE_TOO_LARGE')

          payload = {
              'provider': 'fred',
              'targets': list(targets),
              'capture_mode': 'HISTORICAL_BACKFILL',
              'start_date': start_date.isoformat(),
              'end_date': end_date.isoformat(),
              'trigger': 'github-fred-initial-release-proof',
          }
          Path('/tmp/fred-proof-request.json').write_text(
              json.dumps(payload, sort_keys=True) + '\n',
              encoding='utf-8',
          )

      - name: Configure short-lived staging AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-fred-initial-release-proof
          aws-region: us-east-2

      - name: Verify deployed staging function boundary
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity >/tmp/fred-proof-identity.json
          aws lambda get-function-configuration \
            --function-name daily-alpha-staging-data-feed-ingestion \
            >/tmp/fred-proof-function.json
          python - <<'PY'
          import json
          from pathlib import Path

          cfg = json.loads(Path('/tmp/fred-proof-function.json').read_text())
          assert cfg['FunctionName'] == 'daily-alpha-staging-data-feed-ingestion'
          assert cfg['Runtime'] == 'python3.11'
          env = cfg['Environment']['Variables']
          assert env['RAW_EVIDENCE_BUCKET'].strip()
          assert env['TRADING_AUTHORIZED'] == 'false'
          assert env['LIVE_TRADING_ENABLED'] == 'false'
          with Path('/tmp/fred-proof-bucket.txt').open('w', encoding='utf-8') as handle:
              handle.write(env['RAW_EVIDENCE_BUCKET'].strip())
          PY

      - name: Require deployed FRED initial-release capability before provider call
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"smoke_test":true}' >/tmp/fred-proof-smoke-request.json
          aws lambda invoke \
            --function-name daily-alpha-staging-data-feed-ingestion \
            --cli-binary-format raw-in-base64-out \
            --payload file:///tmp/fred-proof-smoke-request.json \
            /tmp/fred-proof-smoke-result.json >/tmp/fred-proof-smoke-meta.json
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path('/tmp/fred-proof-smoke-meta.json').read_text())
          if meta.get('FunctionError'):
              raise SystemExit('FRED_PROOF_SMOKE_LAMBDA_FUNCTION_ERROR')
          result = json.loads(Path('/tmp/fred-proof-smoke-result.json').read_text())
          assert result['ok'] is True
          assert result['service'] == 'daily-alpha-staging-data-feed-ingestion'
          assert result['historical_backfill_supported'] is True
          assert 'HISTORICAL_BACKFILL' in result['capture_modes']
          assert result['max_historical_backfill_days'] == 31
          assert result['fred_historical_output_type'] == 4
          assert result['known_at_basis'] == 'CAPTURED_AT_ONLY'
          assert result['historical_known_at_backdating_authorized'] is False
          assert result['trading_authorized'] is False
          assert result['live_trading_enabled'] is False
          PY

      - name: Capture real FRED initial-release staging evidence
        shell: bash
        run: |
          set -euo pipefail
          aws lambda invoke \
            --function-name daily-alpha-staging-data-feed-ingestion \
            --cli-binary-format raw-in-base64-out \
            --payload file:///tmp/fred-proof-request.json \
            /tmp/fred-proof-capture-result.json >/tmp/fred-proof-capture-meta.json
          python - <<'PY'
          import json
          from pathlib import Path

          meta = json.loads(Path('/tmp/fred-proof-capture-meta.json').read_text())
          if meta.get('FunctionError'):
              raise SystemExit('FRED_PROOF_CAPTURE_LAMBDA_FUNCTION_ERROR')
          result = json.loads(Path('/tmp/fred-proof-capture-result.json').read_text())
          request = json.loads(Path('/tmp/fred-proof-request.json').read_text())
          assert result['ok'] is True
          assert result['provider'] == 'FRED'
          assert result['capture_mode'] == 'HISTORICAL_BACKFILL'
          assert result['requested_start_date'] == request['start_date']
          assert result['requested_end_date'] == request['end_date']
          assert result['target_count'] == len(request['targets'])
          assert len(result['records']) == len(request['targets'])
          assert result['known_at_basis'] == 'CAPTURED_AT_ONLY'
          assert result['historical_known_at_backdating_authorized'] is False
          assert result['trading_authorized'] is False
          assert result['live_trading_enabled'] is False
          PY

      - name: Rehydrate immutable S3 evidence and build proof packet
        shell: python
        env:
          GIT_COMMIT: ${{ github.sha }}
        run: |
          import json
          import os
          import subprocess
          from pathlib import Path

          from daily_alpha.fred_initial_release import parse_fred_initial_release_history

          bucket = Path('/tmp/fred-proof-bucket.txt').read_text().strip()
          result = json.loads(Path('/tmp/fred-proof-capture-result.json').read_text())
          function_cfg = json.loads(Path('/tmp/fred-proof-function.json').read_text())
          proof_dir = Path('/tmp/fred-proof-evidence')
          proof_dir.mkdir(parents=True, exist_ok=True)
          proof_records = []

          for ordinal, record in enumerate(result['records'], start=1):
              raw_key = str(record['raw_s3_key'])
              if '/fred/raw/' not in raw_key:
                  raise SystemExit('FRED_PROOF_RAW_KEY_OUTSIDE_FRED_PREFIX')
              receipt_key = raw_key.replace('/raw/', '/receipts/', 1)
              if receipt_key == raw_key:
                  raise SystemExit('FRED_PROOF_RECEIPT_KEY_DERIVATION_FAILED')

              raw_path = proof_dir / f'{ordinal:02d}-raw.json'
              receipt_path = proof_dir / f'{ordinal:02d}-receipt.json'
              subprocess.run(
                  ['aws', 's3', 'cp', f's3://{bucket}/{raw_key}', str(raw_path), '--only-show-errors'],
                  check=True,
              )
              subprocess.run(
                  ['aws', 's3', 'cp', f's3://{bucket}/{receipt_key}', str(receipt_path), '--only-show-errors'],
                  check=True,
              )

              raw_body = raw_path.read_bytes()
              receipt = json.loads(receipt_path.read_text(encoding='utf-8'))
              batch = parse_fred_initial_release_history(raw_body=raw_body, receipt=receipt)
              if batch.evidence.target != record['target']:
                  raise SystemExit('FRED_PROOF_TARGET_MISMATCH')
              if receipt['raw_sha256'] != record['raw_sha256']:
                  raise SystemExit('FRED_PROOF_CAPTURE_RECEIPT_SHA_MISMATCH')
              if batch.output_type != 4:
                  raise SystemExit('FRED_PROOF_OUTPUT_TYPE_INVALID')

              proof_records.append(
                  {
                      'target': batch.evidence.target,
                      'batch_id': batch.batch_id,
                      'raw_s3_key': raw_key,
                      'receipt_s3_key': receipt_key,
                      'raw_sha256': receipt['raw_sha256'],
                      'observation_count': len(batch.observations),
                      'first_observation_date': batch.observations[0].observation_date.isoformat(),
                      'last_observation_date': batch.observations[-1].observation_date.isoformat(),
                      'earliest_known_at': batch.observations[0].known_at.isoformat(),
                      'latest_known_at': max(item.known_at for item in batch.observations).isoformat(),
                      'availability_contract': batch.availability_contract,
                      'known_at_policy': batch.known_at_policy,
                      'research_only': batch.research_only,
                      'promotion_authorized': batch.promotion_authorized,
                      'paper_mutation_authorized': batch.paper_mutation_authorized,
                      'trading_authorized': batch.trading_authorized,
                      'live_trading_enabled': batch.live_trading_enabled,
                  }
              )

          packet = {
              'schema': 'DAILY_ALPHA_FRED_INITIAL_RELEASE_STAGING_PROOF_V1',
              'repo_commit': os.environ['GIT_COMMIT'],
              'function_name': function_cfg['FunctionName'],
              'function_code_sha256': function_cfg['CodeSha256'],
              'function_last_modified': function_cfg['LastModified'],
              'provider': 'FRED',
              'capture_mode': 'HISTORICAL_BACKFILL',
              'requested_start_date': result['requested_start_date'],
              'requested_end_date': result['requested_end_date'],
              'target_count': result['target_count'],
              'records': proof_records,
              'known_at_basis': 'CAPTURED_AT_ONLY',
              'historical_known_at_backdating_authorized': False,
              'predictive_alpha_claimed': False,
              'promotion_authorized': False,
              'paper_mutation_authorized': False,
              'trading_authorized': False,
              'live_trading_enabled': False,
          }
          out = Path('/tmp/fred-initial-release-staging-proof.json')
          out.write_text(json.dumps(packet, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(packet, indent=2, sort_keys=True))

      - name: Upload sanitized proof packet
        uses: actions/upload-artifact@v4
        with:
          name: fred-initial-release-staging-proof-${{ github.run_id }}
          path: /tmp/fred-initial-release-staging-proof.json
          if-no-files-found: error
          retention-days: 30

      - name: Summarize proof boundary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## FRED initial-release staging proof complete

          The workflow captured real staging FRED historical evidence, re-read the exact immutable raw object and receipt from S3, and validated them with the repository's provider-specific `FRED_OUTPUT_TYPE_4_INITIAL_RELEASE_V1` parser before emitting a sanitized proof packet.

          This proves only the captured staging evidence contract. It does **not** prove predictive alpha, model promotion, PAPER readiness, execution authority, or live trading.

          `promotion_authorized=false`, `paper_mutation_authorized=false`, `trading_authorized=false`, and `live_trading_enabled=false` remain unchanged.
          EOF
