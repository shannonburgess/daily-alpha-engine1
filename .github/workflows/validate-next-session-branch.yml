name: Validate next-session execution branch

on:
  push:
    branches: [agent/next-session-paper-execution]
    paths:
      - .github/workflows/validate-next-session-branch.yml
      - .github/workflows/scan-execution-universe.yml
      - .github/workflows/execute-pending-next-session.yml
      - src/daily_alpha/execution_queue.py
      - src/daily_alpha/next_session_execution.py
      - src/daily_alpha/orats.py
      - src/daily_alpha/pine_paper_orchestrator.py
      - tests/test_execution_queue.py
      - tests/test_next_session_execution.py
      - tests/test_orats.py
      - tests/test_pine_paper_orchestrator.py

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' pyyaml
      - name: Run full code quality gates
        run: |
          ruff check .
          pytest -q
      - name: Parse production workflow YAML
        shell: python
        run: |
          from pathlib import Path
          import yaml
          for name in (
              ".github/workflows/scan-execution-universe.yml",
              ".github/workflows/execute-pending-next-session.yml",
          ):
              payload = yaml.safe_load(Path(name).read_text(encoding="utf-8"))
              assert isinstance(payload, dict), name
              assert payload.get("jobs"), name
              print(f"parsed {name}")
      - name: Assert after-close workflow cannot execute trades
        shell: bash
        run: |
          if grep -q 'EXECUTE_SCANNER_SIGNAL' .github/workflows/scan-execution-universe.yml; then
            echo "Close workflow contains an execution operation" >&2
            exit 1
          fi
          grep -q 'AFTER_CLOSE_EXECUTION_SAFETY_VIOLATION' .github/workflows/scan-execution-universe.yml
          grep -q 'next_session_execution' .github/workflows/execute-pending-next-session.yml
          grep -q 'OUTSIDE_REGULAR_EXECUTION_WINDOW' src/daily_alpha/pine_paper_orchestrator.py
