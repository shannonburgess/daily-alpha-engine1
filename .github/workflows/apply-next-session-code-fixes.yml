name: Apply next-session executor safety fixes

on:
  push:
    branches: [agent/next-session-paper-execution]
    paths: [.github/workflows/apply-next-session-code-fixes.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/next-session-paper-execution
      - name: Fail hard on unsafe processor response
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/daily_alpha/next_session_execution.py")
          text = path.read_text(encoding="utf-8")
          marker = '''LATEST_PREFIX = "daily-alpha/execution-universe/latest"\n\n\n'''
          replacement = '''LATEST_PREFIX = "daily-alpha/execution-universe/latest"\n\n\nclass UnsafeExecutionError(RuntimeError):\n    """Raised when a downstream response violates the paper-only safety contract."""\n\n\n'''
          if marker not in text:
              raise SystemExit("next-session class marker not found")
          text = text.replace(marker, replacement, 1)
          old = '''        except (OratsError, RuntimeError, ValueError, TypeError) as exc:\n            deferred_data_error += 1'''
          new = '''        except UnsafeExecutionError:\n            raise\n        except (OratsError, RuntimeError, ValueError, TypeError) as exc:\n            deferred_data_error += 1'''
          if old not in text:
              raise SystemExit("next-session exception target not found")
          text = text.replace(old, new, 1)
          old = '''    if body.get("live_trading_enabled") is not False:\n        raise RuntimeError(f"Unsafe live trading response: {body}")'''
          new = '''    if body.get("live_trading_enabled") is not False:\n        raise UnsafeExecutionError(f"Unsafe live trading response: {body}")'''
          if old not in text:
              raise SystemExit("next-session live safety target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Commit safety fix
        shell: bash
        run: |
          git config user.name "daily-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/daily_alpha/next_session_execution.py
          git commit -m "Fail hard on unsafe next-session response"
          git push origin HEAD:agent/next-session-paper-execution
