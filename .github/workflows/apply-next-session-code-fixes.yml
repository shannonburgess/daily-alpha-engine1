name: Apply next-session executor safety fixes

on:
  push:
    branches: [agent/next-session-paper-execution]
    paths: [.github/workflows/apply-next-session-code-fixes.yml]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/next-session-paper-execution
      - name: Add market-hours guard and ORATS compatibility
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/daily_alpha/orats.py")
          text = path.read_text(encoding="utf-8")
          old = '''class OratsChain:\n    ticker: str\n    stock_price: float\n    candidates: tuple[OptionCandidate, ...]\n    observed_at: datetime\n    source_mode: str'''
          new = '''class OratsChain:\n    ticker: str\n    candidates: tuple[OptionCandidate, ...]\n    observed_at: datetime\n    source_mode: str\n    stock_price: float | None = None'''
          if old not in text:
              raise SystemExit("OratsChain target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")

          path = Path("src/daily_alpha/pine_paper_orchestrator.py")
          text = path.read_text(encoding="utf-8")
          old = "from datetime import UTC, date, datetime\nfrom typing import Any"
          new = "from datetime import UTC, date, datetime, time\nfrom typing import Any\nfrom zoneinfo import ZoneInfo"
          if old not in text:
              raise SystemExit("orchestrator imports target not found")
          text = text.replace(old, new, 1)
          old = '''        timestamp = _aware(now or datetime.now(UTC))\n        action = str(ingress.get("action", "")).upper()\n        if action == "ENTRY_LONG":\n            return self._entry(ingress, timestamp)\n        if action in {"ADD", "PARTIAL", "EXIT"}:\n            return self._runner(ingress, timestamp)\n        raise PinePaperExecutionError("PINE_ACTION_UNSUPPORTED")'''
          new = '''        timestamp = _aware(now or datetime.now(UTC))\n        action = str(ingress.get("action", "")).upper()\n        if action not in {"ENTRY_LONG", "ADD", "PARTIAL", "EXIT"}:\n            raise PinePaperExecutionError("PINE_ACTION_UNSUPPORTED")\n        symbol = _required_text(ingress.get("symbol"), "symbol").upper()\n        if not _regular_execution_window(timestamp):\n            return _execution_result(\n                disposition="NO_TRADE",\n                reason="OUTSIDE_REGULAR_EXECUTION_WINDOW",\n                action=action,\n                symbol=symbol,\n            )\n        if action == "ENTRY_LONG":\n            return self._entry(ingress, timestamp)\n        return self._runner(ingress, timestamp)'''
          if old not in text:
              raise SystemExit("orchestrator execute target not found")
          text = text.replace(old, new, 1)
          marker = '''def _paper_nav_from_env() -> float:\n'''
          helper = '''def _regular_execution_window(value: datetime) -> bool:\n    local = _aware(value).astimezone(ZoneInfo("America/New_York"))\n    if local.weekday() >= 5:\n        return False\n    clock = local.time().replace(tzinfo=None)\n    return time(9, 40) <= clock < time(15, 50)\n\n\n'''
          if marker not in text:
              raise SystemExit("orchestrator helper marker not found")
          path.write_text(text.replace(marker, helper + marker, 1), encoding="utf-8")

          path = Path("tests/test_pine_paper_orchestrator.py")
          text = path.read_text(encoding="utf-8")
          if "test_after_close_signal_cannot_mutate_paper_ledger" not in text:
              text += '''\n\ndef test_after_close_signal_cannot_mutate_paper_ledger(tmp_path):\n    fake_orats = FakeOrats()\n    service = executor(tmp_path, fake_orats)\n    after_close = datetime(2026, 8, 17, 20, 5, tzinfo=UTC)\n\n    result = service.execute(ingress(), now=after_close)\n\n    assert result["disposition"] == "NO_TRADE"\n    assert result["reason"] == "OUTSIDE_REGULAR_EXECUTION_WINDOW"\n    assert result["paper_execution_triggered"] is False\n    assert result["live_trading_enabled"] is False\n    assert service.ledger.find_open("AAPL") == []\n    assert fake_orats.calls == []\n'''
          path.write_text(text, encoding="utf-8")
      - name: Commit safety fixes
        shell: bash
        run: |
          git config user.name "daily-alpha-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/daily_alpha/orats.py src/daily_alpha/pine_paper_orchestrator.py tests/test_pine_paper_orchestrator.py
          git commit -m "Block paper fills outside regular session"
          git push origin HEAD:agent/next-session-paper-execution
