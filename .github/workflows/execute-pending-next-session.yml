name: Legacy Daily Alpha next-session executor (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Stock-primary policy guard
        shell: bash
        run: |
          cat <<'EOF'
          This legacy next-session execution path is disabled.

          Canonical policy:
          - New PAPER entries are SHARES ONLY.
          - Fresh confirmed Pine/scanner signal prices are PAPER model-validation fills.
          - Fresh after-close stock signals must not be forced into next-session execution/replay.
          - ORATS/options data must not authorize, reject, delay, or block a new STOCK PAPER entry.
          - Replay remains only for genuinely pre-existing ARMED records through the canonical replay workflow.
          - trading_authorized=false
          - live_trading_enabled=false

          Historical pending-action artifacts remain audit evidence only and are not executable by this workflow.
          EOF
