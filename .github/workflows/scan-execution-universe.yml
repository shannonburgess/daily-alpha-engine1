name: Legacy Daily Alpha execution-universe scanner (disabled)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Stock-primary policy guard
        shell: bash
        run: |
          cat <<'EOF'
          This legacy execution-universe scanner is disabled as an execution path.

          It previously depended on ORATS historical data and staged fresh scanner signals
          for next-session execution. That conflicts with the canonical stock-primary
          model-validation policy.

          Canonical policy:
          - New PAPER entries are SHARES ONLY.
          - A fresh confirmed scanner signal uses its confirmed signal price as the PAPER model-validation fill.
          - ORATS/options data may remain research/newsletter intelligence only and cannot gate a new STOCK PAPER entry.
          - Fresh after-close scanner signals are not converted into next-session pending execution.
          - trading_authorized=false
          - live_trading_enabled=false

          Historical scanner/pending artifacts remain audit evidence only. A replacement
          stock-primary scanner path must be built against issues #180/#213 without reviving
          this pending-next-session executor.
          EOF
