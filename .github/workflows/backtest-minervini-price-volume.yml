name: Minervini-inspired price-volume backtest

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/daily_alpha/minervini_backtest.py"
      - "tests/test_minervini_backtest.py"
      - ".github/workflows/backtest-minervini-price-volume.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q tests/test_minervini_backtest.py

  backtest:
    if: github.event_name == 'workflow_dispatch'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require ORATS secret
        run: test -n "$ORATS_TOKEN"
      - name: Run price-volume model
        run: |
          PYTHONPATH=src python -m daily_alpha.minervini_backtest \
            --start 2020-01-01 --end 2026-08-14 \
            --json-out minervini-backtest.json | tee minervini-backtest.txt
      - name: Publish summary
        run: |
          { echo "## Minervini-inspired price-volume backtest"; echo '```text'; cat minervini-backtest.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: minervini-price-volume-backtest
          path: |
            minervini-backtest.json
            minervini-backtest.txt
          if-no-files-found: error
