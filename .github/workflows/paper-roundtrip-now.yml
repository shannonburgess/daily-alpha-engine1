name: Verify paper trader restored after roundtrip

on:
  push:
    branches:
      - ops/paper-roundtrip-20260819
    paths:
      - .github/workflows/paper-roundtrip-now.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/paper-roundtrip-now.yml

permissions:
  contents: read
  id-token: write

jobs:
  verify-restored:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 5
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-paper-roundtrip-verify
          aws-region: us-east-2

      - name: Verify temporary account is not configured
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws lambda get-function-configuration \
            --function-name daily-alpha-paper-trader \
            --query 'Environment.Variables.DAILY_ALPHA_PAPER_ACCOUNT_ID' \
            --output text)"
          if [ "$ACCOUNT" = "PAPER_SYSTEM_TEST" ]; then
            echo "TEMPORARY PAPER ACCOUNT STILL CONFIGURED"
            exit 1
          fi
          echo "PAPER TRADER RESTORE: PASS"
          echo "temporary_account_removed=true"
          echo "live_trading_enabled=false"
