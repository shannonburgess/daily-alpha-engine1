name: Debug Ruff import fix

on:
  push:
    branches: [agent/v24-backtest-baseline-70]

permissions:
  contents: read

jobs:
  show-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.3
      - name: Show Ruff import fix
        shell: bash
        run: |
          ruff check --select I --fix src/daily_alpha/backtest.py
          git diff -- src/daily_alpha/backtest.py
