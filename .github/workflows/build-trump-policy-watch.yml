name: Build Trump administration policy watch

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: daily-alpha-trump-policy-watch
  cancel-in-progress: false

jobs:
  policy-watch:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STAGING_BUCKET: daily-alpha-staging-490809405132-us-east-2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .

      - name: Build official White House company and policy watch
        id: policy_watch
        shell: python
        run: |
          import os
          from datetime import UTC, datetime

          from daily_alpha.trump_policy import (
              build_trump_policy_snapshot,
              rank_trump_policy_companies,
              write_trump_policy_outputs,
          )
          from daily_alpha.white_house_policy import (
              WHITE_HOUSE_INVESTMENTS_URL,
              fetch_white_house_investments,
          )

          now = datetime.now(UTC)
          raw = fetch_white_house_investments(limit=50)
          ranked = rank_trump_policy_companies(raw, limit=10)
          snapshot = build_trump_policy_snapshot(
              generated_at=now,
              companies=ranked,
              source_url=WHITE_HOUSE_INVESTMENTS_URL,
          )
          outputs = write_trump_policy_outputs("data/trump-policy", snapshot)
          assert all(path.exists() for path in outputs.values())

          print("Trump Administration Company & Policy Watch:")
          for item in ranked:
              print(
                  f"{item.rank}. {item.symbol} {item.company} score={item.score:.2f} "
                  f"investment=${item.investment_usd:,.0f} bonus=+{item.research_bonus:.1f}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"count={len(ranked)}\n")
              handle.write("leaders=" + ", ".join(item.symbol for item in ranked[:5]) + "\n")

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-trump-policy-publish
          aws-region: us-east-2

      - name: Publish policy watch to AWS staging
        shell: bash
        run: |
          PREFIX="s3://${STAGING_BUCKET}/ovtlyr/trump-policy"
          HISTORY="${PREFIX}/history/${GITHUB_RUN_ID}"
          for FILE in data/trump-policy/*; do
            NAME="$(basename "$FILE")"
            aws s3 cp "$FILE" "${PREFIX}/latest/${NAME}" --only-show-errors
            aws s3 cp "$FILE" "${HISTORY}/${NAME}" --only-show-errors
          done
          echo "Published Trump policy watch to ${PREFIX}/latest/"

      - name: Upload policy-watch artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-trump-policy-${{ github.run_id }}
          path: data/trump-policy/*
          if-no-files-found: error
          retention-days: 30

      - name: Summarize policy watch
        shell: bash
        run: |
          {
            echo "## Trump Administration Company & Policy Watch"
            echo "- Official source: White House Investments page"
            echo "- Ranked public companies: ${{ steps.policy_watch.outputs.count }}"
            echo "- Top 5 policy-watch leaders: ${{ steps.policy_watch.outputs.leaders }}"
            echo "- This is not presented as a list of stock recommendations by President Trump."
            echo "- Policy/company mentions are research confirmation only; no paper or live trade was authorized."
          } >> "$GITHUB_STEP_SUMMARY"
