name: Diagnose ORATS API access

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose ORATS token and endpoint access
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}

    steps:
      - name: Require ORATS secret
        shell: bash
        run: |
          if [[ -z "$ORATS_TOKEN" ]]; then
            echo "ORATS_TOKEN GitHub secret is missing" >&2
            exit 1
          fi

      - name: Test delayed strikes and intraday access without exposing token
        shell: python
        run: |
          import os
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          token = os.environ["ORATS_TOKEN"]
          base = "https://api.orats.io/datav2"

          def probe(name, path, ticker="AAPL", extra=None):
              params = {"token": token, "ticker": ticker}
              if extra:
                  params.update(extra)
              query = urlencode(params)
              request = Request(f"{base}/{path}?{query}", headers={"Accept": "*/*"})
              try:
                  with urlopen(request, timeout=20) as response:
                      body = response.read(600).decode("utf-8", errors="replace")
                      status = int(response.status)
              except HTTPError as exc:
                  status = int(exc.code)
                  body = exc.read(600).decode("utf-8", errors="replace")
              except URLError as exc:
                  print(f"{name}: NETWORK_ERROR {type(exc.reason).__name__}")
                  return None

              safe_body = body.replace(token, "***").replace("\n", " ").strip()[:300]
              print(f"{name}: HTTP {status}")
              if safe_body:
                  print(f"{name}_BODY: {safe_body}")
              return status

          core_status = probe("CORE_DATA_API", "cores")
          strikes_status = probe("DELAYED_STRIKES_API", "strikes", extra={"dte": "45,75"})
          intraday_status = probe("DELAYED_INTRADAY_API", "one-minute/strikes/chain")

          print("--- DIAGNOSIS ---")
          base_ok = core_status is not None and 200 <= core_status < 300
          strikes_ok = strikes_status is not None and 200 <= strikes_status < 300
          intraday_ok = intraday_status is not None and 200 <= intraday_status < 300

          if base_ok and strikes_ok and intraday_ok:
              print("ORATS_ACCESS=STANDARD_AND_INTRADAY_OK")
          elif base_ok and strikes_ok and intraday_status == 403:
              print("ORATS_ACCESS=STANDARD_STRIKES_OK_INTRADAY_FORBIDDEN")
              print("NEXT_ACTION=USE_STANDARD_STRIKES_FOR_DAILY_ALPHA")
          elif base_ok and not strikes_ok:
              print("ORATS_ACCESS=BASE_OK_STANDARD_STRIKES_BLOCKED")
              print("NEXT_ACTION=CHECK_ORATS_DATA_API_ENTITLEMENT")
          elif core_status == 403:
              print("ORATS_ACCESS=BASE_API_FORBIDDEN")
              print("NEXT_ACTION=VERIFY_TOKEN_OR_ACCOUNT_API_ACCESS")
          elif core_status in {401, 404}:
              print("ORATS_ACCESS=BASE_API_AUTH_OR_ENDPOINT_ERROR")
              print("NEXT_ACTION=VERIFY_TOKEN")
          else:
              print("ORATS_ACCESS=INCONCLUSIVE")

          # Diagnostic classification only: a blocked endpoint must not fail the
          # workflow or authorize any trading decision.
