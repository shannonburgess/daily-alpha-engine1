name: Research Earnings EARLY cohort

on:
  push:
    branches:
      - agent/earnings-early-research-refresh
    paths:
      - "research/run_earnings_early_cohort.py"
      - ".github/workflows/research-earnings-early-cohort.yml"
      - "src/daily_alpha/earnings_early_research.py"
      - "src/daily_alpha/backtest.py"
  pull_request:
    branches:
      - main
    paths:
      - "research/run_earnings_early_cohort.py"
      - ".github/workflows/research-earnings-early-cohort.yml"
      - "src/daily_alpha/earnings_early_research.py"
      - "src/daily_alpha/backtest.py"
  workflow_dispatch:

concurrency:
  group: daily-alpha-orats-heavy-research
  cancel-in-progress: false

jobs:
  cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Compile research runner
        run: python -m py_compile research/run_earnings_early_cohort.py
      - name: Run Earnings EARLY cohort
        run: python research/run_earnings_early_cohort.py
      - name: Upload cohort artifact
        uses: actions/upload-artifact@v4
        with:
          name: earnings-early-underlying-cohort
          path: earnings-early-cohort.json
          retention-days: 30
