name: Research R2 targeted search

on:
  push:
    branches: [agent/r2-model-search]
    paths:
      - research/run_r2_targeted_search.py
      - .github/workflows/research-r2-targeted.yml

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Run targeted search
        run: python research/run_r2_targeted_search.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-r2-targeted
          path: |
            r2-targeted.json
            r2-targeted.md
          if-no-files-found: error
          retention-days: 30
