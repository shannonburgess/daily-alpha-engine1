name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v24-backtest-baseline-70
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Apply Ruff import fix to branch
        shell: bash
        run: |
          ruff check --select I --fix src/daily_alpha/backtest.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/daily_alpha/backtest.py
          git diff --cached --quiet || git commit -m "Apply Ruff import ordering fix"
          git push origin HEAD:agent/v24-backtest-baseline-70
      - run: ruff check .
      - run: pytest -q
