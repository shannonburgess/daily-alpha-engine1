name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Count Daily Alpha lines of code
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def files_under(roots, suffixes):
              files = []
              for root in roots:
                  path = Path(root)
                  if not path.exists():
                      continue
                  for file in path.rglob('*'):
                      if file.is_file() and file.suffix in suffixes:
                          files.append(file)
              return sorted(set(files))

          groups = {
              'PRODUCTION_PYTHON': files_under(('src', 'lambda_handlers', 'scripts'), {'.py'}),
              'TEST_PYTHON': files_under(('tests',), {'.py'}),
              'TRADINGVIEW_PINE': files_under(('tradingview',), {'.pine'}),
              'GITHUB_WORKFLOWS': files_under(('.github/workflows',), {'.yml', '.yaml'}),
          }

          total_physical = 0
          total_nonblank = 0
          total_files = 0
          for name, files in groups.items():
              physical = 0
              nonblank = 0
              for file in files:
                  text = file.read_text(encoding='utf-8', errors='ignore')
                  lines = text.splitlines()
                  physical += len(lines)
                  nonblank += sum(bool(line.strip()) for line in lines)
              total_physical += physical
              total_nonblank += nonblank
              total_files += len(files)
              print(f'LOC_RESULT {name} files={len(files)} physical={physical} nonblank={nonblank}')

          print(f'LOC_RESULT TOTAL_ENGINEERING files={total_files} physical={total_physical} nonblank={total_nonblank}')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q
