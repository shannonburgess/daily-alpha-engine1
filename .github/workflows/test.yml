name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Diagnose Ruff import fix
        shell: bash
        run: |
          ruff check --select I --fix src/daily_alpha/backtest.py
          git diff -- src/daily_alpha/backtest.py
          exit 1
      - run: pytest -q
