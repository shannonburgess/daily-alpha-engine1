name: Research v2.5 10-day R expectancy

on:
  push:
    branches: [agent/v25-10day-breakout-study]
    paths:
      - research/run_v25_10day_r_expectancy.py
      - .github/workflows/research-v25-10day-r-expectancy.yml

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Run R expectancy study
        run: python research/run_v25_10day_r_expectancy.py
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-v25-10day-r-expectancy
          path: |
            v25-10day-r-expectancy.json
            v25-10day-r-expectancy.md
          if-no-files-found: error
          retention-days: 30
