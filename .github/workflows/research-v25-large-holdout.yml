name: Research v2.5 large-universe holdout

on:
  push:
    branches: [agent/v25-large-universe-holdout]
    paths:
      - research/run_v25_large_holdout.py
      - .github/workflows/research-v25-large-holdout.yml

permissions:
  contents: read

jobs:
  holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Run large-universe holdout
        run: python research/run_v25_large_holdout.py
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-v25-large-holdout
          path: |
            v25-large-holdout.json
            v25-large-holdout.md
          if-no-files-found: error
          retention-days: 30
