name: Analyze LRCX March-July v2.4 gates

on:
  push:
    branches: [agent/analyze-lrcx-march-july]
    paths: [.github/workflows/analyze-lrcx-march-july.yml]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Replay LRCX entry gates
        shell: python
        run: |
          import json
          import os
          from datetime import date
          from pathlib import Path

          from daily_alpha.backtest import fetch_orats_history, indicators, run_strategy

          token = os.environ.get('ORATS_TOKEN', '').strip()
          if not token:
              raise SystemExit('ORATS_TOKEN missing')

          start = date(2026, 3, 1)
          end = date(2026, 7, 31)
          bars, meta = fetch_orats_history(
              'LRCX', start=date(2026, 1, 1), end=end, token=token
          )
          ind = indicators(bars)
          v24_trades, v24_events = run_strategy(bars, ind, version='2.4', start=start, end=end)
          v23_trades, _ = run_strategy(bars, ind, version='2.3', start=start, end=end)

          in_window = [(i,b,r) for i,(b,r) in enumerate(zip(bars,ind)) if start <= b.trade_date <= end]
          first = in_window[0][1]
          last = in_window[-1][1]
          high_bar = max((b for _,b,_ in in_window), key=lambda b:b.close)
          low_bar = min((b for _,b,_ in in_window), key=lambda b:b.close)

          def gates(b, r):
              price_ok = b.close >= 25.0
              eff_ok = r['efficiency'] is not None and float(r['efficiency']) >= 0.20
              rsi_ok = r['rsi'] is not None and float(r['rsi']) <= 80.0
              adx_ok = r['adx'] is not None and float(r['adx']) >= 25.0
              breakout_now = r['upper20'] is not None and b.close > float(r['upper20'])
              normal_base = (
                  breakout_now
                  and not bool(r['is_earnings_up_gap'])
                  and int(r['trend_state']) == 1
                  and bool(r['normal_trend_mature'])
              )
              normal_all = normal_base and price_ok and eff_ok and rsi_ok and adx_ok
              actual_normal = normal_all and bool(r['fresh_breakout'])
              actual_gap = bool(r['gap_go']) and bool(r['fresh_breakout']) and price_ok
              return {
                  'breakout_now': breakout_now,
                  'fresh_breakout': bool(r['fresh_breakout']),
                  'trend_state': int(r['trend_state']),
                  'trend_mature': bool(r['normal_trend_mature']),
                  'price_ok': price_ok,
                  'eff_ok': eff_ok,
                  'rsi_ok': rsi_ok,
                  'adx_ok': adx_ok,
                  'actual_entry': actual_normal or actual_gap,
                  'continuation_eligible': normal_all,
              }

          rows = []
          fresh = []
          continuation = []
          for i,b,r in in_window:
              g = gates(b,r)
              item = {
                  'date': b.trade_date.isoformat(),
                  'open': b.open,
                  'high': b.high,
                  'low': b.low,
                  'close': b.close,
                  'upper20': r['upper20'],
                  'lower10': r['lower10'],
                  'atr': r['atr'],
                  'adx': r['adx'],
                  'rsi': r['rsi'],
                  'efficiency': r['efficiency'],
                  'earnings_up_gap': bool(r['is_earnings_up_gap']),
                  **g,
              }
              if g['fresh_breakout']:
                  reasons=[]
                  if g['trend_state'] != 1: reasons.append('TREND_NOT_BULLISH')
                  if not g['trend_mature']: reasons.append('TREND_NOT_MATURE')
                  if not g['price_ok']: reasons.append('PRICE_LT_25')
                  if not g['eff_ok']: reasons.append('EFF_LT_0.20')
                  if not g['rsi_ok']: reasons.append('RSI_GT_80')
                  if not g['adx_ok']: reasons.append('ADX_LT_25')
                  if bool(r['is_earnings_up_gap']) and not bool(r['gap_go']): reasons.append('EARNINGS_GAP_NOT_FULL_GO')
                  item['fresh_breakout_fail_reasons'] = reasons
                  fresh.append(item)
              if g['continuation_eligible'] and not g['fresh_breakout']:
                  continuation.append(item)
              if g['breakout_now'] or g['fresh_breakout'] or g['actual_entry']:
                  rows.append(item)

          # Earliest possible entries under relaxed variants.
          variants = {}
          checks = {
              'actual_v24': lambda b,r,g: g['actual_entry'],
              'no_maturity_only': lambda b,r,g: (
                  g['fresh_breakout'] and not bool(r['is_earnings_up_gap']) and g['trend_state']==1
                  and g['price_ok'] and g['eff_ok'] and g['rsi_ok'] and g['adx_ok']
              ) or (bool(r['gap_go']) and g['fresh_breakout'] and g['price_ok']),
              'no_rsi_only': lambda b,r,g: (
                  g['fresh_breakout'] and not bool(r['is_earnings_up_gap']) and g['trend_state']==1
                  and g['trend_mature'] and g['price_ok'] and g['eff_ok'] and g['adx_ok']
              ) or (bool(r['gap_go']) and g['fresh_breakout'] and g['price_ok']),
              'no_adx_only': lambda b,r,g: (
                  g['fresh_breakout'] and not bool(r['is_earnings_up_gap']) and g['trend_state']==1
                  and g['trend_mature'] and g['price_ok'] and g['eff_ok'] and g['rsi_ok']
              ) or (bool(r['gap_go']) and g['fresh_breakout'] and g['price_ok']),
              'continuation_allowed': lambda b,r,g: g['continuation_eligible'] or (
                  bool(r['gap_go']) and g['price_ok'] and (g['breakout_now'] or g['fresh_breakout'])
              ),
          }
          for name, fn in checks.items():
              hit=None
              for i,b,r in in_window:
                  g=gates(b,r)
                  if fn(b,r,g):
                      hit={'date':b.trade_date.isoformat(),'close':b.close,'gates':g,'adx':r['adx'],'rsi':r['rsi'],'efficiency':r['efficiency'],'upper20':r['upper20']}
                      break
              variants[name]=hit

          result = {
              'symbol':'LRCX',
              'window':[start.isoformat(),end.isoformat()],
              'source': meta[0].get('source') if meta else 'ORATS',
              'start_close': first.close,
              'end_close': last.close,
              'window_return_pct': (last.close/first.close-1)*100,
              'max_close': high_bar.close,
              'max_close_date': high_bar.trade_date.isoformat(),
              'min_close': low_bar.close,
              'min_close_date': low_bar.trade_date.isoformat(),
              'v24_trades':[t.__dict__ for t in v24_trades],
              'v23_trades':[t.__dict__ for t in v23_trades],
              'fresh_breakouts': fresh,
              'continuation_eligible_nonfresh_count': len(continuation),
              'first_continuation_eligible_nonfresh': continuation[0] if continuation else None,
              'entry_variant_first_hits': variants,
              'breakout_related_rows': rows,
              'earnings_events': v24_events,
          }
          Path('lrcx-analysis.json').write_text(json.dumps(result,indent=2,default=str),encoding='utf-8')

          print(f"LRCX {start} -> {end}: {first.close:.2f} -> {last.close:.2f} ({result['window_return_pct']:.1f}%)")
          print(f"Max close {high_bar.close:.2f} on {high_bar.trade_date}")
          print('v2.4 trades:', json.dumps(result['v24_trades'], indent=2))
          print('v2.3 trades:', json.dumps(result['v23_trades'], indent=2))
          print('\nFRESH BREAKOUTS:')
          for x in fresh:
              print(json.dumps({k:x.get(k) for k in ['date','close','upper20','trend_state','trend_mature','adx','rsi','efficiency','earnings_up_gap','actual_entry','fresh_breakout_fail_reasons']}, default=str))
          print('\nFIRST HITS BY VARIANT:')
          print(json.dumps(variants, indent=2, default=str))
          print(f"\nContinuation-eligible but non-fresh days: {len(continuation)}")
          if continuation:
              x=continuation[0]
              print('First continuation day:',json.dumps({k:x.get(k) for k in ['date','close','upper20','adx','rsi','efficiency','trend_mature']},default=str))
      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: lrcx-march-july-analysis
          path: lrcx-analysis.json
          if-no-files-found: error
          retention-days: 30
