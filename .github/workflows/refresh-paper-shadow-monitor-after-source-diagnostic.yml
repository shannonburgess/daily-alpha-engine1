name: Refresh Daily Alpha shadow monitor after source diagnostic

on:
  workflow_run:
    workflows:
      - Diagnose SH24 source-side signal coverage
    types:
      - completed

permissions:
  actions: write
  contents: read

concurrency:
  group: daily-alpha-paper-shadow-diagnostic-refresh
  cancel-in-progress: true

jobs:
  dispatch-current-monitor:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch canonical PAPER-shadow monitor on trusted main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run monitor-paper-shadows.yml \
            --repo "${REPO}" \
            --ref main
