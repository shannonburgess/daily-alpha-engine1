name: Research v2.5 runner persistence

on:
  push:
    branches: [agent/v25-runner-persistence-study]
    paths:
      - research/run_v25_runner_persistence.py
      - .github/workflows/research-v25-runner-persistence.yml

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Daily Alpha
        run: python -m pip install --disable-pip-version-check .
      - name: Run runner persistence study
        run: python research/run_v25_runner_persistence.py
      - name: Upload research result
        uses: actions/upload-artifact@v4
        with:
          name: daily-alpha-v25-runner-persistence
          path: |
            v25-runner-persistence.json
            v25-runner-persistence.md
          if-no-files-found: error
          retention-days: 30
