name: Verify AWS staging OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-identity:
    name: Verify short-lived AWS identity
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Display exact GitHub OIDC claims
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8')
            );
            core.notice(`OIDC issuer: ${payload.iss}`);
            core.notice(`OIDC audience: ${payload.aud}`);
            core.notice(`OIDC subject: ${payload.sub}`);

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-github-staging-test
          aws-region: us-east-2

      - name: Verify assumed role
        run: aws sts get-caller-identity
