name: Verify AWS staging OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-aws-identity:
    name: Verify short-lived AWS identity
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-github-staging-test
          aws-region: us-east-1

      - name: Verify assumed role
        run: aws sts get-caller-identity
