name: Backtest Gap & Go sensitivity

on:
  pull_request:
    paths:
      - "src/daily_alpha/backtest.py"
      - "src/daily_alpha/backtest_sensitivity.py"
      - "tradingview/da_turtle_20_10_v2_4.pine"
      - ".github/workflows/backtest-gap-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sensitivity:
    name: Close-location threshold sensitivity
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require ORATS secret
        shell: bash
        run: |
          if [[ -z "$ORATS_TOKEN" ]]; then
            echo "ORATS_TOKEN GitHub secret is missing" >&2
            exit 1
          fi
      - name: Run sensitivity study
        shell: bash
        run: |
          PYTHONPATH=src python -m daily_alpha.backtest_sensitivity \
            --start 2024-01-01 \
            --end 2026-08-14 \
            --thresholds 0.60,0.65,0.70,0.75,0.80 \
            --json-out gap-sensitivity.json | tee gap-sensitivity.txt
          {
            echo "## Gap & Go close-location sensitivity"
            echo
            echo "> Fixed exploratory cohort; use for robustness testing, not production performance claims."
            echo
            echo '```text'
            cat gap-sensitivity.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sensitivity result
        uses: actions/upload-artifact@v4
        with:
          name: gap-go-close-location-sensitivity
          path: |
            gap-sensitivity.json
            gap-sensitivity.txt
          if-no-files-found: error
