name: Verify YouTube behavioral secret

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/verify-youtube-behavioral-secret.yml

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::490809405132:role/DailyAlphaGitHubStagingDeployRole
          role-session-name: daily-alpha-youtube-secret-check
          aws-region: us-east-2

      - name: Discover existing Daily Alpha execution role
        shell: bash
        run: |
          set -euo pipefail
          ROLE="$(aws lambda get-function-configuration \
            --function-name daily-alpha-engine \
            --query Role \
            --output text)"
          echo "daily_alpha_engine_role=${ROLE}"
          echo "secret_name=daily-alpha/youtube-api-key"

      - name: Verify secret and YouTube API without exposing key
        shell: bash
        run: |
          set -euo pipefail
          aws secretsmanager get-secret-value \
            --secret-id daily-alpha/youtube-api-key \
            --query SecretString \
            --output text > /tmp/youtube-secret.json

          python3 - <<'PY' > /tmp/youtube-key.txt
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/youtube-secret.json').read_text())
          key = str(payload.get('YOUTUBE_API_KEY', '')).strip()
          if not key:
              raise SystemExit('YOUTUBE_API_KEY missing from secret')
          print(key)
          PY

          KEY="$(cat /tmp/youtube-key.txt)"
          RESPONSE="$(curl --fail --silent --show-error --get \
            'https://www.googleapis.com/youtube/v3/search' \
            --data-urlencode 'part=snippet' \
            --data-urlencode 'type=video' \
            --data-urlencode 'q=NVIDIA' \
            --data-urlencode 'maxResults=1' \
            --data-urlencode "key=${KEY}")"

          printf '%s' "$RESPONSE" > /tmp/youtube-response.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/youtube-response.json').read_text())
          assert isinstance(data.get('items'), list), data
          assert len(data['items']) >= 1, data
          print('YOUTUBE SECRET ACCESS: PASS')
          print('YOUTUBE DATA API V3: PASS')
          print('query=NVIDIA')
          print('results_received=' + str(len(data['items'])))
          print('secret_exposed=false')
          print('trading_authorized=false')
          print('live_trading_enabled=false')
          PY

          rm -f /tmp/youtube-secret.json /tmp/youtube-key.txt /tmp/youtube-response.json
