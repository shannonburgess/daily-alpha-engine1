name: Backtest broad cohort

on:
  pull_request:
    paths:
      - ".github/workflows/backtest-large-cohort.yml"
      - "src/daily_alpha/backtest_sensitivity.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orats-research
  queue: max

jobs:
  broad:
    name: Broad liquid cohort 60 vs 70 vs 75
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Require ORATS secret
        run: test -n "$ORATS_TOKEN"
      - name: Run broad cohort
        shell: bash
        run: |
          TICKERS="AAPL,MSFT,NVDA,AMD,AVGO,MU,QCOM,MRVL,ARM,INTC,AMZN,GOOGL,META,NFLX,CRM,NOW,ORCL,TSLA,DELL,ADBE,PANW,CRWD,PLTR,ANET,IBM,TSM,ASML,LRCX,AMAT,KLAC,GE,CAT,BA,JPM,GS,V,MA,WMT,COST,HD,LLY,UNH,ABBV,ISRG,XOM,CVX,COP,NKE,SBUX,UBER"
          PYTHONPATH=src python -m daily_alpha.backtest_sensitivity \
            --tickers "$TICKERS" --start 2024-01-01 --end 2026-08-14 \
            --thresholds 0.60,0.70,0.75 --json-out broad-cohort.json | tee broad-cohort.txt
      - name: Add summary
        shell: bash
        run: |
          { echo "## Broad 50-name cohort"; echo '```text'; cat broad-cohort.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: broad-cohort-backtest
          path: |
            broad-cohort.json
            broad-cohort.txt
          if-no-files-found: error
