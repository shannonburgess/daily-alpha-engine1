name: Backtest conservative Gap Go options

on:
  pull_request:
    paths:
      - "src/daily_alpha/backtest_options_conservative.py"
      - ".github/workflows/backtest-options-conservative.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conservative:
    name: Ask entry bid exit Gap Go options
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORATS_TOKEN: ${{ secrets.ORATS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run conservative option test
        shell: bash
        run: |
          test -n "$ORATS_TOKEN"
          PYTHONPATH=src python -m daily_alpha.backtest_options_conservative \
            --thresholds 0.70,0.75 --json-out conservative-options.json \
            | tee conservative-options.txt
      - name: Add summary
        shell: bash
        run: |
          {
            echo "## Conservative Gap & Go historical option backtest"
            echo '```text'
            cat conservative-options.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: conservative-gapgo-options
          path: |
            conservative-options.json
            conservative-options.txt
          if-no-files-found: error
