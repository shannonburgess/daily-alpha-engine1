[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-alpha-engine"
version = "0.1.0"
description = "Auditable Daily Alpha research and paper-trading decision engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
daily-alpha = "daily_alpha.cli:main"
daily-alpha-compare = "daily_alpha.ovtlyr_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/daily_alpha/backtest.py" = ["FURB105", "I001"]
"src/daily_alpha/backtest_sensitivity.py" = ["BLE001"]
"src/daily_alpha/multi_asset_contracts.py" = ["PYI041", "UP035"]
"tests/test_multi_asset_contracts.py" = ["C408", "DTZ001"]
